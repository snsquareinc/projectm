<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SN Square Projects</title>
<style>
:root{
  --navy:#14213D; --teal:#0D9488; --teal-d:#0F766E; --indigo:#4F46E5; --emerald:#059669; --amber:#D97706; --rose:#E11D48;
  --ink:#0F172A; --ink2:#334155; --muted:#64748B; --line:#E2E8F0; --soft:#F1F5F9; --card:#FFFFFF; --bg:#F1F5F9;
  --amber-bg:#FFFBEB; --amber-ink:#92400E; --rose-bg:#FFF1F2; --rose-ink:#BE123C;
  --emerald-bg:#ECFDF5; --emerald-ink:#047857; --indigo-bg:#EEF2FF; --indigo-ink:#4338CA;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:12px} .bad{color:var(--rose-ink)} .warnText{color:var(--amber-ink)}

/* Header and navigation */
.top{background:var(--navy);color:#fff;padding:12px 16px 12px;border-radius:0 0 20px 20px;position:sticky;top:0;z-index:4}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#94A3B8;font-weight:600}
.top h1{margin:4px 0 0;font-size:22px;line-height:1.2;font-weight:700;overflow-wrap:anywhere}
.top .sub{margin:4px 0 0;color:#94A3B8;font-size:13px}
.tabs{display:flex;gap:4px;margin-top:10px;background:rgba(255,255,255,.08);border-radius:12px;padding:4px}
.tabs a{flex:1;text-align:center;text-decoration:none;color:#CBD5E1;padding:7px 6px;border-radius:9px;font-size:14px;font-weight:600;white-space:nowrap}
.tabs a[aria-current="page"]{background:#fff;color:var(--navy)}
.back{color:#94A3B8;text-decoration:none;font-size:13px;font-weight:600}
main{padding:14px 16px 110px;display:flex;flex-direction:column;gap:12px;max-width:1180px;margin:0 auto}
.bottomnav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:4}
.bottomnav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600;padding:6px 0;border-radius:10px}
.bottomnav a[aria-current="page"]{color:var(--teal-d);background:#F0FDFA}

/* Page pieces */
.page-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.page-h h2{margin:0;font-size:18px;font-weight:700}
.section-t{font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:1px;margin:6px 0 -4px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.04);display:flex;flex-direction:column;gap:10px}
.card.clickable{text-decoration:none;color:inherit;display:block}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card-h strong{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.05);overflow:hidden}
.strip>div{padding:12px 14px;border-left:1px solid var(--soft);min-width:0}
.strip>div:first-child{border-left:0}
.strip .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .small{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .warnText{color:var(--amber-ink)}
.strip.teal{background:var(--teal)}
@media (max-width:560px){ .strip{grid-template-columns:repeat(2,minmax(0,1fr))} .strip>div:nth-child(3){border-left:0} .strip>div:nth-child(n+3){border-top:1px solid var(--soft)} }
.tile{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.tile .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.tile .v{font-size:19px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.tile.teal{background:var(--teal);color:#fff} .tile.teal .l{color:#CCFBF1}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--teal);border-radius:999px}
.bar.ok>i{background:var(--emerald)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--soft);color:var(--ink2)}
.b-ok{background:var(--emerald-bg);color:var(--emerald-ink)}
.b-warn{background:var(--amber-bg);color:var(--amber-ink)}
.b-bad{background:var(--rose-bg);color:var(--rose-ink)}
.b-info{background:var(--indigo-bg);color:var(--indigo-ink)}
.b-mute{background:var(--soft);color:var(--muted)}
.notice{border-radius:12px;padding:10px 12px;font-size:13px;background:var(--amber-bg);color:var(--amber-ink);border:1px solid #FDE68A}
.notice.bad{background:var(--rose-bg);color:var(--rose-ink);border-color:#FECDD3}
.notice.ok{background:var(--emerald-bg);color:var(--emerald-ink);border-color:#A7F3D0}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--soft);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;cursor:pointer}
.row:first-child{border-top:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.row .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto 14px;gap:2px 12px;padding:10px 0;border-top:1px solid var(--soft);font-size:13px;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer;align-items:center}
.line .n{overflow-wrap:anywhere;color:var(--ink)}
.line .c{font-size:12px;color:var(--muted)}
.line .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.line .chev{color:var(--teal-d);font-size:18px;line-height:1;font-weight:700}
.hint-line{font-size:12px;color:var(--muted);margin-top:2px}
.sheet-tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px;font-variant-numeric:tabular-nums}
.sheet-tbl th,.sheet-tbl td{padding:8px 10px;border-bottom:1px solid var(--soft);text-align:left;white-space:nowrap;vertical-align:middle}
.sheet-tbl thead th{background:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;position:sticky;top:0;border-bottom:1px solid var(--line)}
.sheet-tbl thead tr.band th{background:var(--navy);color:#fff;text-align:center;font-size:11px;letter-spacing:.8px;border-bottom:1px solid #2B3A5E}
.sheet-tbl .r{text-align:right}
.sheet-tbl .ctr{text-align:center}
.sheet-tbl td.code{width:86px;color:var(--muted);font-weight:600}
.sheet-tbl td.desc{min-width:240px}
.sheet-tbl td.wrap{white-space:normal}
.sheet-tbl tr.item td.desc{padding-left:26px}
.sheet-tbl tr.item td{vertical-align:top;padding-top:10px;padding-bottom:10px}
.sheet-tbl tr.grp td{background:#E8F3F1;font-weight:700;color:var(--navy);border-top:1px solid #CFE7E3;padding-top:10px;padding-bottom:10px}
.sheet-tbl tr.grp td.code{color:var(--teal-d)}
.sheet-tbl tr.grp td.desc{text-transform:uppercase;letter-spacing:.3px;font-size:12px}
.sheet-tbl tr.tr-click{cursor:pointer}
.sheet-tbl tr.tr-click:hover td{background:#F8FAFC}
.sheet-tbl tr.tr-grand td{background:var(--navy);color:#fff;font-weight:700;border-bottom:0}
@media (max-width:640px){
  .sheet-tbl, .sheet-tbl tbody{display:block;min-width:0}
  .sheet-tbl thead{display:none}
  .sheet-tbl tr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--soft)}
  .sheet-tbl td{display:none;border:0;padding:0;white-space:normal;min-width:0}
  .sheet-tbl td.m-name,.sheet-tbl td.m-amt,.sheet-tbl td.m-meta,.sheet-tbl td.m-owed{display:block}
  .sheet-tbl tr.item{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name amt" "meta owed";gap:2px 12px}
  .sheet-tbl tr.item td.m-name{grid-area:name;font-weight:600;padding-left:0}
  .sheet-tbl tr.item td.m-amt{grid-area:amt;text-align:right;font-weight:700}
  .sheet-tbl tr.item td.m-meta{grid-area:meta;color:var(--muted);font-size:12px}
  .sheet-tbl tr.item td.m-owed{grid-area:owed;text-align:right;font-size:12px;color:var(--muted)}
  .sheet-tbl tr.grp{background:#E8F3F1;justify-content:space-between;padding:10px 14px}
  .sheet-tbl tr.grp td.m-name{flex:1 1 55%;font-size:12px}
  .sheet-tbl tr.grp td.m-amt{font-weight:700;color:var(--navy)}
  .sheet-tbl tr.grp td.m-owed{font-size:12px;color:var(--muted)}
  .sheet-tbl tr.tr-grand{background:var(--navy);color:#fff;justify-content:space-between}
  .sheet-tbl tr.tr-grand td.m-name{flex:1 1 55%}
  .sheet-tbl tr.tr-grand td.m-amt{font-weight:700}
  .sheet-tbl tr.tr-grand td.m-owed{font-size:12px;color:#CBD5E1}
}
.note{font-size:12px;color:var(--muted);font-weight:400;white-space:normal;margin-top:2px}
.calc{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--soft);border-radius:12px;padding:12px 14px}
.calc strong{font-size:18px}

.line-h{display:grid;grid-template-columns:minmax(0,1fr) auto auto 14px;gap:12px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;padding-top:6px}
.line-h span:not(:first-child){text-align:right}
details{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--teal-d);font-size:20px;line-height:1}
details[open] summary::after{content:"–"}
details .sub-li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--soft);font-size:14px}
details .sub-li span:first-child{overflow-wrap:anywhere}

/* Buttons and fields */
.btn{padding:11px 14px;border:1px solid var(--line);background:#fff;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--navy);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--rose-ink);border-color:#FECDD3;background:#fff}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.6}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1}
.empty{background:var(--card);border-radius:16px;padding:22px 16px;text-align:center;color:var(--muted);box-shadow:0 1px 2px rgba(15,23,42,.05)}
input,select{width:100%;padding:11px 12px;border:1px solid #CBD5E1;border-radius:12px;background:#fff;font-size:16px;min-width:0}
input[type=checkbox]{width:auto;padding:0;accent-color:var(--teal)}
input[type=file]{padding:9px;font-size:14px}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--ink2);min-width:0}
label.check{flex-direction:row;align-items:center;gap:8px;font-size:14px;font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
.seg{display:flex;gap:4px;background:var(--line);border-radius:12px;padding:4px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:9px 10px;border-radius:9px;font-weight:600;font-size:13px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}

/* Sheet (bottom sheet on phone, dialog on wide screens) */
dialog.sheet{border:0;border-radius:18px;padding:0;width:min(620px,calc(100vw - 24px));max-height:92vh;overflow:auto;color:var(--ink);background:#fff;box-shadow:0 20px 50px rgba(15,23,42,.3)}
dialog.sheet::backdrop{background:rgba(15,23,42,.5)}
dialog.sheet form{display:flex;flex-direction:column;gap:14px;padding:18px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h2{margin:0;font-size:18px;font-weight:700;overflow-wrap:anywhere}
.x{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--ink2)}
.sheet .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.sheet .actions .spacer{flex:1}
.err{margin:0;color:var(--rose-ink);font-size:14px;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.file-li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--soft);font-size:14px}
.file-li span{overflow-wrap:anywhere}
@media (max-width:600px){
  dialog.sheet{position:fixed;margin:0;top:auto;bottom:0;left:0;right:0;width:100%;max-width:none;max-height:92vh;border-radius:18px 18px 0 0}
}

/* Toast */
.toast{position:fixed;left:16px;right:16px;bottom:84px;max-width:560px;margin:0 auto;background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;z-index:6;box-shadow:0 10px 30px rgba(15,23,42,.3)}
.toast.bad{background:var(--rose-ink)}

/* Desktop app shell */
.side{display:none}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar input[type=search]{width:240px;padding:8px 12px;font-size:14px}
@media (min-width:900px){
  .side{box-sizing:border-box;display:flex;flex-direction:column;gap:18px;position:fixed;left:0;top:0;bottom:0;width:232px;background:var(--navy);color:#fff;padding:20px 14px;overflow:auto;overflow-x:hidden;z-index:5}
  .side>*{min-width:0;margin-left:0;margin-right:0}
  .side-brand{display:flex;gap:10px;align-items:center;padding:4px 8px 6px}
  .side-mark{width:34px;height:34px;border-radius:10px;background:var(--teal);display:grid;place-items:center;font-weight:800;font-size:13px}
  .side-name{font-weight:700;font-size:15px}
  .side-sub{font-size:11px;color:#94A3B8;letter-spacing:.4px}
  .side-sec{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#94A3B8;padding:12px 10px 4px;font-weight:700;overflow-wrap:anywhere}
  .side a{display:block;text-decoration:none;color:#CBD5E1;border-radius:8px;position:relative}
  .side a:hover{background:rgba(255,255,255,.06);color:#fff}
  .side a.top{padding:10px 12px;font-size:15px;font-weight:600}
  .side a.child{padding:8px 12px 8px 20px;margin-left:12px;border-left:2px solid #2E3B57;border-radius:0 8px 8px 0;font-size:14px;font-weight:500}
  .side a[aria-current="page"]{background:rgba(45,212,191,.16);color:#fff;font-weight:700}
  .side a.child[aria-current="page"]{border-left-color:#2DD4BF}
  .side a.top[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:3px;background:#2DD4BF}
  .side-group{display:flex;flex-direction:column;gap:2px;margin-top:6px}
  .side-group>.side-sec{margin-top:14px}
  .side-sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#8A97AD;padding:12px 12px 6px;margin:0;line-height:1.2}
  .side-group>.side-sec:first-child{margin-top:0}
  .side-btn{width:100%;margin-top:6px;padding:9px 12px;border-radius:10px;border:1px solid #334155;background:transparent;color:#CBD5E1;font-weight:600;font-size:13px;cursor:pointer;text-align:left}
  .side-foot{margin-top:auto}
  .back-link{color:#CBD5E1 !important;font-size:13px !important;padding:6px 12px !important;background:none !important}
  .back-link:hover{color:#fff !important}
  .side-proj{background:rgba(255,255,255,.07);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
  .side-pname{font-weight:700;font-size:15px;overflow-wrap:anywhere}
  .shell{margin-left:232px;min-height:100vh}
  .bottomnav{display:none}
  .top .tabs,.top .back{display:none}
  .top{border-radius:0;padding:14px 28px}
  main{max-width:none;padding:20px 28px 60px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
}

/* Gate */
.gate{max-width:380px;margin:12vh auto 0;padding:0 16px}
.gate .card{margin-top:10px}
.hidden{display:none !important}
</style>
</head>
<body>

<!-- Sign-in -->
<section id="gate" class="gate hidden">
  <div class="brand">SN Square Group</div>
  <h1 style="margin:6px 0 0;font-size:24px;color:var(--navy)">Project Tracker</h1>
  <div class="card">
    <form id="loginForm" style="display:flex;flex-direction:column;gap:12px">
      <label>Email<input type="email" name="email" autocomplete="username" required></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn navy" type="submit">Sign In</button>
      <p class="err" id="loginErr" hidden></p>
    </form>
  </div>
</section>

<!-- App shell -->
<div id="app" class="hidden">
  <aside class="side" id="side"></aside>
  <div class="shell">
    <header class="top" id="topbar"></header>
    <main id="main"></main>
    <nav class="bottomnav" id="bottomnav">
      <a href="#/projects" data-nav="projects">Projects</a>
      <a href="#/library" data-nav="library">Library</a>
      <a href="#/vendors" data-nav="vendors">Contractors</a>
    </nav>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../config.js"></script>
<script>
'use strict';

// ---------- Helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (v === '' || v == null) return 0; const n = Number(String(v).replace(/[$,\s]/g, '')); return Number.isFinite(n) ? n : 0; };
const money = n => Number(n || 0).toLocaleString('en-US', {style:'currency', currency:'USD', minimumFractionDigits:0, maximumFractionDigits:2});
const fmtInput = n => (n === '' || n == null) ? '' : Number(n).toLocaleString('en-US', {maximumFractionDigits:2});
function formatMoneyText(raw){
  const cleaned = String(raw).replace(/[^0-9.]/g, '');
  if (!cleaned) return '';
  const parts = cleaned.split('.');
  const whole = (parts[0] || '').replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const dec = parts.length > 1 ? '.' + parts.slice(1).join('').slice(0, 2) : '';
  return whole + dec;
}
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fmtDate = s => s ? new Date(s + 'T12:00:00').toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}) : '—';
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
const msg = e => (e && (e.message || e.error_description)) || String(e);
const pct = (a, b) => b > 0 ? Math.min(100, Math.round(a / b * 100)) : 0;

const DISMISS_REASONS = [
  'Vendor has no employees (owner-operator)',
  'Covered under another policy or umbrella',
  'Vendor is not doing work on site',
  'Owner is handling insurance for this scope',
  'Other (explain below)'
];
const PAY_METHODS = ['Check', 'ACH', 'Wire', 'Cash', 'Card'];
const PROJECT_STATUS = ['Planning', 'Active', 'Sold'];

const sb = supabase.createClient(window.TRACKER_CONFIG.url, window.TRACKER_CONFIG.anonKey);
let session = null;

// Library cache (global) and current project cache
const S = { divs: [], subs: [], divMap: {}, subMap: {}, vendors: [], proj: null, year: new Date().getFullYear() };

function setLibrary(divs, subs){
  S.divs = divs; S.subs = subs;
  S.divMap = Object.fromEntries(divs.map(d => [d.code, d]));
  S.subMap = Object.fromEntries(subs.map(s => [s.code, s]));
}
const divName = code => S.divMap[code] ? `${code} ${S.divMap[code].name}` : code;
const lineName = l => l.subtask_code ? (S.subMap[l.subtask_code]?.name || l.subtask_code) : (l.label || 'Custom line');
const budgetOf = l => num(l.budget) + num(l.revision);

function toast(text, bad = false){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  t.textContent = text;
  document.body.append(t);
  setTimeout(() => t.remove(), 5000);
}

function check(res){ if (res.error) throw res.error; return res.data; }

// Certificate of insurance status for one vendor on one project
function latestInsMap(rows){
  const m = {};
  rows.forEach(r => { const k = r.vendor_id + '|' + r.project_id; if (!(k in m)) m[k] = r; });
  return m;
}
function coiStatus(r){
  if (!r) return 'missing';
  if (r.dismissed_reason) return 'dismissed';
  if (!r.file_path) return 'missing';
  if (r.expires_on && r.expires_on < todayISO()) return 'expired';
  if (r.expires_on && daysBetween(todayISO(), r.expires_on) <= 30) return 'soon';
  return 'ok';
}
const COI_BADGE = {
  missing: ['b-bad', 'COI missing'], expired: ['b-bad', 'COI expired'], soon: ['b-warn', 'COI expiring soon'],
  ok: ['b-ok', 'COI on file'], dismissed: ['b-mute', 'Reminder dismissed']
};
const coiBadge = st => `<span class="badge ${COI_BADGE[st][0]}">${COI_BADGE[st][1]}</span>`;

// ---------- Library (global) ----------
async function loadLibrary(){
  const [d, s] = await Promise.all([
    sb.from('library_divisions').select('*').eq('retired', false).order('code'),
    sb.from('library_subtasks').select('*').eq('retired', false).order('code')
  ]);
  setLibrary(check(d), check(s));
}

// ---------- Projects list ----------
async function renderProjects(){
  const [p, l, pay, pv, ins] = await Promise.all([
    sb.from('projects').select('*').order('created_at', {ascending:false}),
    sb.from('project_lines').select('project_id, division_code, subtask_code, label, budget, revision, bank_funded, id'),
    sb.from('payments').select('project_id, amount'),
    sb.from('project_vendors').select('project_id, vendor_id, vendors(name)'),
    sb.from('vendor_insurance').select('*').order('created_at', {ascending:false})
  ]);
  const projects = check(p), lines = check(l), pays = check(pay), pvs = check(pv), insRows = check(ins);
  const insMap = latestInsMap(insRows);

  const reminders = [];
  pvs.forEach(row => {
    const st = coiStatus(insMap[row.vendor_id + '|' + row.project_id]);
    if (st === 'missing' || st === 'expired'){
      reminders.push({projectId: row.project_id, vendor: row.vendors?.name || 'Contractor', st});
    }
  });
  const projName = Object.fromEntries(projects.map(x => [x.id, x.name]));

  let html = `
    <div class="page-h">
      <h2>Projects</h2>
      <button class="btn primary" data-act="new-project">New Project</button>
    </div>`;

  if (reminders.length){
    html += `<div class="notice bad"><strong>${reminders.length} contractor${reminders.length > 1 ? 's' : ''} need a certificate of insurance.</strong>
      <div style="margin-top:6px">${reminders.map(r => `<div><a href="#/project/${r.projectId}/contractors" style="color:inherit">${esc(r.vendor)} · ${esc(projName[r.projectId] || 'Project')}</a></div>`).join('')}</div>
      <div class="small" style="margin-top:6px">This reminder shows every day until the certificate is added or dismissed with a reason.</div></div>`;
  }

  if (!projects.length){
    html += `<div class="empty">No projects yet. Create one to start the budget.</div>`;
  }

  projects.forEach(pr => {
    const ls = lines.filter(x => x.project_id === pr.id);
    const budget = ls.reduce((a, x) => a + budgetOf(x), 0);
    const paid = pays.filter(x => x.project_id === pr.id).reduce((a, x) => a + num(x.amount), 0);
    const owed = Math.max(0, budget - paid);
    const missing = reminders.filter(r => r.projectId === pr.id).length;
    html += `
      <a class="card clickable" href="#/project/${pr.id}/budget">
        <div class="card-h"><strong>${esc(pr.name)}</strong><span class="badge ${pr.status === 'Active' ? 'b-info' : ''}">${esc(pr.status)}</span></div>
        ${pr.address ? `<div class="small muted">${esc(pr.address)}</div>` : ''}
        <div class="bar ${budget && paid >= budget ? 'ok' : ''}"><i style="width:${pct(paid, budget)}%"></i></div>
        <div class="card-h" style="font-size:13px">
          <span class="muted">Budget <span class="num" style="color:var(--ink)">${money(budget)}</span></span>
          <span class="muted">Paid <span class="num" style="color:var(--ink)">${money(paid)}</span></span>
          <span class="muted">Owed <span class="num" style="color:var(--ink)">${money(owed)}</span></span>
        </div>
        ${missing ? `<span class="badge b-bad" style="align-self:flex-start">${missing} COI missing</span>` : ''}
      </a>`;
  });

  $('#main').innerHTML = html;
  setTopbar('SN Square Group', 'Projects', `${projects.length} project${projects.length === 1 ? '' : 's'}`, '');
}

// ---------- Project shell ----------
async function loadProject(id){
  const [p, l, pay, pv, ins, v] = await Promise.all([
    sb.from('projects').select('*').eq('id', id).single(),
    sb.from('project_lines').select('*').eq('project_id', id).order('created_at'),
    sb.from('payments').select('*, vendors(name)').eq('project_id', id).order('pay_date', {ascending:false}),
    sb.from('project_vendors').select('vendor_id').eq('project_id', id),
    sb.from('vendor_insurance').select('*').eq('project_id', id).order('created_at', {ascending:false}),
    sb.from('vendors').select('*').order('name')
  ]);
  const pays = check(pay);
  const ids = pays.map(x => x.id);
  const receipts = ids.length ? check(await sb.from('payment_receipts').select('*').in('payment_id', ids).order('created_at')) : [];
  S.vendors = check(v);
  S.proj = {
    project: check(p),
    lines: check(l),
    pays,
    receipts,
    assignedIds: new Set(check(pv).map(x => x.vendor_id)),
    insMap: latestInsMap(check(ins))
  };
}

// ---------- Budget ----------
function paidByLine(P){
  const m = {};
  P.pays.forEach(p => { m[p.budget_line_id] = (m[p.budget_line_id] || 0) + num(p.amount); });
  return m;
}

function budgetGroups(P){
  const q = (S.budgetQuery || '').trim().toLowerCase();
  const lines = q ? P.lines.filter(l => [lineName(l), l.subtask_code, l.division_code, divName(l.division_code), l.unit, l.notes]
    .some(x => String(x || '').toLowerCase().includes(q))) : P.lines;
  const byDiv = {};
  lines.forEach(l => { (byDiv[l.division_code] ||= []).push(l); });
  return {byDiv, codes: Object.keys(byDiv).sort(), filtered: !!q};
}

function renderBudget(P){
  const paid = paidByLine(P);
  const totalBudget = P.lines.reduce((a, l) => a + budgetOf(l), 0);
  const totalPaid = P.pays.reduce((a, p) => a + num(p.amount), 0);
  const bankBudget = P.lines.filter(l => l.bank_funded).reduce((a, l) => a + budgetOf(l), 0);
  const notBank = totalBudget - bankBudget;
  const divCount = new Set(P.lines.map(l => l.division_code)).size;

  let html = `
    <div class="strip">
      <div><div class="l">Total Budget</div><div class="v">${money(totalBudget)}</div></div>
      <div><div class="l">Paid Out</div><div class="v">${money(totalPaid)}</div></div>
      <div><div class="l">Still Owed</div><div class="v warnText">${money(Math.max(0, totalBudget - totalPaid))}</div></div>
      <div><div class="l">Bank Funded</div><div class="v">${money(bankBudget)}</div>${notBank ? `<div class="small muted">${money(notBank)} not bank funded</div>` : ''}</div>
    </div>
    <div class="page-h">
      <div>
        <h2>Budget</h2>
        <div class="small muted">${divCount} division${divCount === 1 ? '' : 's'} · ${P.lines.length} line${P.lines.length === 1 ? '' : 's'}</div>
      </div>
      <div class="toolbar">
        <input type="search" id="budgetSearch" placeholder="Search lines, codes, notes" value="${esc(S.budgetQuery || '')}" aria-label="Search budget lines">
        <button class="btn sm" data-act="export-csv">Export CSV</button>
        <button class="btn primary sm" data-act="add-line">+ Budget Line</button>
      </div>
    </div>`;

  if (!P.lines.length){
    html += `<div class="empty">No budget yet. Add the sub-tasks from the Library, or a custom line.</div>`;
    $('#main').innerHTML = html;
    return;
  }
  html += `<div id="budgetTable">${budgetBody(P)}</div>`;
  $('#main').innerHTML = html;
}

function budgetBody(P){
  const {byDiv, codes, filtered} = budgetGroups(P);
  if (!codes.length){
    return `<div class="empty">No lines match “${esc(S.budgetQuery)}”.</div>`;
  }
  return budgetTableHtml(P, paidByLine(P), byDiv, codes, filtered);
}

// ---------- Budget spreadsheet view ----------
function fmtQty(n){ return Number(n || 0).toLocaleString('en-US', {maximumFractionDigits: 2}); }

function budgetTableHtml(P, paid, byDiv, codes, filtered){
  const body = [];
  let gBud = 0, gRev = 0, gPaid = 0;
  codes.forEach(code => {
    const ls = byDiv[code];
    const dBud = ls.reduce((a, l) => a + num(l.budget), 0);
    const dRev = ls.reduce((a, l) => a + num(l.revision), 0);
    const dTot = dBud + dRev;
    const dPaid = ls.reduce((a, l) => a + (paid[l.id] || 0), 0);
    body.push(`<tr class="grp">
      <td class="code">${esc(code)}</td>
      <td class="desc m-name">${esc((S.divMap[code]?.name || 'Unnamed Division').toUpperCase())}</td>
      <td></td><td></td><td></td>
      <td class="r">${money(dBud)}</td>
      <td class="r">${dRev ? money(dRev) : ''}</td>
      <td class="r m-amt">${money(dTot)}</td>
      <td class="r">${money(dPaid)}</td>
      <td class="r m-owed">${money(Math.max(0, dTot - dPaid))}</td>
      <td></td>
    </tr>`);
    ls.forEach(l => {
      const bl = budgetOf(l), lp = paid[l.id] || 0;
      body.push(`<tr class="item tr-click" data-act="edit-line" data-id="${l.id}">
        <td class="code">${esc(l.subtask_code || '')}</td>
        <td class="desc wrap m-name">${esc(lineName(l))}${l.notes ? `<div class="note">${esc(l.notes)}</div>` : ''}</td>
        <td>${esc(l.unit || '')}</td>
        <td class="r">${fmtQty(l.qty)}</td>
        <td class="r">${money(l.rate)}</td>
        <td class="r">${money(l.budget)}</td>
        <td class="r">${Number(l.revision) ? money(l.revision) : ''}</td>
        <td class="r m-amt">${money(bl)}</td>
        <td class="r m-meta">${money(lp)}</td>
        <td class="r m-owed">${money(Math.max(0, bl - lp))}</td>
        <td class="ctr">${l.bank_funded ? 'Yes' : 'No'}</td>
      </tr>`);
    });
    gBud += dBud; gRev += dRev; gPaid += dPaid;
  });
  const gTot = gBud + gRev;
  body.push(`<tr class="tr-grand">
    <td colspan="3" class="m-name">${filtered ? 'Shown Total' : 'Total Budget'}</td>
    <td></td><td></td>
    <td class="r">${money(gBud)}</td>
    <td class="r">${gRev ? money(gRev) : ''}</td>
    <td class="r m-amt">${money(gTot)}</td>
    <td class="r">${money(gPaid)}</td>
    <td class="r m-owed">${money(Math.max(0, gTot - gPaid))}</td>
    <td></td>
  </tr>`);
  return `<div class="card" style="padding:0;overflow-x:auto">
    <table class="sheet-tbl">
      <thead>
        <tr class="band"><th class="code"></th><th class="desc"></th><th></th><th colspan="2">Quantity</th><th colspan="3">Estimated Cost</th><th colspan="2">Paid To Date</th><th>Funding</th></tr>
        <tr><th class="code">Code</th><th class="desc">Description</th><th>Unit</th><th class="r">Sq.Ft. / Qty</th><th class="r">Rate</th><th class="r">Budget</th><th class="r">Revision</th><th class="r">Total</th><th class="r">Paid</th><th class="r">Owed</th><th class="ctr">Bank Funded</th></tr>
      </thead>
      <tbody>${body.join('')}</tbody>
    </table>
  </div>
  <div class="small muted" style="text-align:center">Tap a line to edit it. Export CSV opens in Excel.</div>`;
}

function exportBudgetCsv(){
  const P = S.proj;
  const paid = paidByLine(P);
  const rows = [['Division', 'Code', 'Sub-Task', 'Unit', 'Sq.Ft. / Qty', 'Rate', 'Budget', 'Revision', 'Total', 'Paid', 'Owed', 'Bank Funded', 'Notes']];
  P.lines.slice().sort((a, b) => a.division_code.localeCompare(b.division_code)).forEach(l => {
    const bl = budgetOf(l), lp = paid[l.id] || 0;
    rows.push([divName(l.division_code), l.subtask_code || 'Custom', lineName(l), l.unit || '', num(l.qty), num(l.rate), num(l.budget), num(l.revision), bl, lp, Math.max(0, bl - lp), l.bank_funded ? 'Yes' : 'No', l.notes || '']);
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['﻿' + csv], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (P.project.name + ' Budget.csv').replace(/[\\/:*?"<>|]/g, '-');
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ---------- Payments ----------
function renderPayments(P){
  const total = P.pays.reduce((a, p) => a + num(p.amount), 0);
  const rcCount = {};
  P.receipts.forEach(r => { rcCount[r.payment_id] = (rcCount[r.payment_id] || 0) + 1; });

  let html = `
    <div class="page-h">
      <h2>Payments · ${money(total)}</h2>
      <button class="btn primary sm" data-act="new-payment">+ Record Payment</button>
    </div>`;

  if (!P.pays.length){
    html += `<div class="empty">No payments yet. Every payment needs a budget line before it is saved.</div>`;
  } else {
    html += `<div class="card" style="padding:4px 16px"><div class="rows">`;
    P.pays.forEach(p => {
      const line = P.lines.find(l => l.id === p.budget_line_id);
      html += `
        <button class="row" data-act="open-pay" data-id="${p.id}">
          <div><div class="t">${esc(p.vendors?.name || 'No vendor')}</div>
            <div class="s">${fmtDate(p.pay_date)} · ${esc(line ? lineName(line) : 'Unclassified')}</div>
            <div class="s">${esc(p.method)}${p.reference ? ' #' + esc(p.reference) : ''}${rcCount[p.id] ? ' · ' + rcCount[p.id] + ' receipt' + (rcCount[p.id] > 1 ? 's' : '') : ''}</div></div>
          <div class="amt">${money(p.amount)}</div>
        </button>`;
    });
    html += `</div></div>`;
  }
  $('#main').innerHTML = html;
}

// ---------- Contractors (assigned to this project) ----------
function renderContractors(P){
  const assigned = S.vendors.filter(v => P.assignedIds.has(v.id));
  const rows = assigned.map(v => {
    const ins = P.insMap[v.id + '|' + P.project.id];
    const st = coiStatus(ins);
    const paid = P.pays.filter(p => p.vendor_id === v.id).reduce((a, p) => a + num(p.amount), 0);
    return {v, st, ins, paid};
  });
  const needing = rows.filter(r => r.st === 'missing' || r.st === 'expired');

  let html = `
    <div class="page-h">
      <h2>Contractors On This Project</h2>
      <button class="btn primary sm" data-act="assign">+ Assign Contractor</button>
    </div>`;

  if (needing.length){
    html += `<div class="notice bad"><strong>${needing.length} certificate${needing.length > 1 ? 's' : ''} of insurance missing.</strong>
      <div class="small" style="margin-top:4px">This reminder shows every day until you add the certificate or dismiss it with a reason.</div></div>`;
  }

  if (!rows.length){
    html += `<div class="empty">No contractors assigned yet. Assigning one asks you for their certificate of insurance.</div>`;
  }

  rows.forEach(r => {
    const open = r.st === 'missing' || r.st === 'expired' || r.st === 'soon';
    html += `
      <div class="card">
        <div class="card-h"><strong>${esc(r.v.name)}</strong><span class="num" style="font-weight:700">${money(r.paid)} paid</span></div>
        <div class="small muted">${esc([r.v.trade, r.v.company].filter(Boolean).join(' · ') || 'No trade listed')}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${coiBadge(r.st)}
          <span class="badge ${r.v.w9_path ? 'b-ok' : 'b-warn'}">${r.v.w9_path ? 'W-9 on file' : 'W-9 missing'}</span>
        </div>
        ${r.ins && r.ins.dismissed_reason ? `<div class="small muted">Dismissed: ${esc(r.ins.dismissed_reason)}${r.ins.dismissed_by ? ' · ' + esc(r.ins.dismissed_by) : ''}</div>` : ''}
        ${r.ins && r.ins.file_path && !r.ins.dismissed_reason ? `<div class="small muted">${esc(r.ins.insurer || 'Insurer not listed')}${r.ins.expires_on ? ' · expires ' + fmtDate(r.ins.expires_on) : ''}${r.ins.holder_listed ? ' · bank listed as holder' : ''}</div>` : ''}
        <div class="btn-row">
          ${open
            ? `<button class="btn primary" data-act="add-coi" data-id="${r.v.id}">Add Certificate</button>
               <button class="btn" data-act="dismiss-coi" data-id="${r.v.id}">Dismiss With Reason</button>`
            : `<button class="btn" data-act="add-coi" data-id="${r.v.id}">Update Certificate</button>`}
        </div>
      </div>`;
  });

  $('#main').innerHTML = html;
}

// ---------- Vendors (global) ----------
async function renderVendors(){
  const [v, p] = await Promise.all([
    sb.from('vendors').select('*').order('name'),
    sb.from('payments').select('vendor_id, amount, pay_date')
  ]);
  S.vendors = check(v);
  const pays = check(p);
  const year = String(S.year);
  const yearTotal = {}, allTotal = {};
  pays.forEach(x => {
    if (!x.vendor_id) return;
    const a = num(x.amount);
    allTotal[x.vendor_id] = (allTotal[x.vendor_id] || 0) + a;
    if (String(x.pay_date).startsWith(year)) yearTotal[x.vendor_id] = (yearTotal[x.vendor_id] || 0) + a;
  });
  const now = new Date().getFullYear();
  const yearOpts = [now, now - 1, now - 2].map(y => `<option value="${y}" ${y === S.year ? 'selected' : ''}>${y}</option>`).join('');

  let html = `
    <div class="page-h">
      <h2>Contractors</h2>
      <button class="btn primary sm" data-act="new-vendor">+ Add Contractor</button>
    </div>
    <div class="card" style="flex-direction:row;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px">
      <span class="small muted">1099 Year</span>
      <select id="yearSel" style="width:auto;padding:8px 10px">${yearOpts}</select>
    </div>`;

  if (!S.vendors.length){
    html += `<div class="empty">No contractors yet. Add one here, or assign them to a project.</div>`;
  } else {
    html += `<div class="card" style="padding:4px 16px"><div class="rows">`;
    S.vendors.forEach(x => {
      const t1099 = x.is_corporation ? 'Corporation, no 1099' : money(yearTotal[x.id] || 0) + ' for 1099';
      html += `
        <button class="row" data-act="open-vendor" data-id="${x.id}">
          <div><div class="t">${esc(x.name)}</div>
            <div class="s">${esc([x.trade, x.company].filter(Boolean).join(' · ') || 'No trade listed')}</div>
            <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
              <span class="badge ${x.w9_path ? 'b-ok' : 'b-warn'}">${x.w9_path ? 'W-9 on file' : 'W-9 missing'}</span>
            </div></div>
          <div style="text-align:right"><div class="amt">${money(allTotal[x.id] || 0)}</div><div class="s">${t1099}</div></div>
        </button>`;
    });
    html += `</div></div>`;
  }
  html += `<div class="small muted" style="text-align:center">1099 totals are payments in the year selected, excluding corporations.</div>`;

  $('#main').innerHTML = html;
  setTopbar('SN Square Group', 'Contractors', `${S.vendors.length} on file`, '');
}

// ---------- Library view ----------
async function renderLibrary(){
  await loadLibrary();
  const subsByDiv = {};
  S.subs.forEach(s => { (subsByDiv[s.division_code] ||= []).push(s); });

// ---------- Sheets (forms) ----------
function sheet({title, html, submit = 'Save', onSubmit, onOpen, danger}){
  const d = document.createElement('dialog');
  d.className = 'sheet';
  d.innerHTML = `<form novalidate>
    <div class="sheet-h"><h2>${esc(title)}</h2><button type="button" class="x" data-close aria-label="Close">×</button></div>
    ${html}
    <p class="err" hidden></p>
    <div class="actions">
      ${danger ? `<button type="button" class="btn danger" data-danger>${esc(danger.label)}</button><span class="spacer"></span>` : '<span class="spacer"></span>'}
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary">${esc(submit)}</button>
    </div>
  </form>`;
  document.body.append(d);
  d.addEventListener('close', () => d.remove());
  const form = d.querySelector('form');
  d.querySelectorAll('input.money').forEach(el => el.addEventListener('input', () => { el.value = formatMoneyText(el.value); }));
  const err = d.querySelector('.err');
  const showErr = e => { err.textContent = msg(e); err.hidden = false; };
  d.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => d.close()));
  if (danger){
    d.querySelector('[data-danger]').addEventListener('click', async () => {
      if (!confirm(danger.confirm || 'Delete this? This cannot be undone.')) return;
      try { await danger.run(); d.close(); await render(); } catch (e) { showErr(e); }
    });
  }
  form.addEventListener('submit', async e => {
    e.preventDefault();
    err.hidden = true;
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true;
    try { await onSubmit(form); d.close(); await render(); }
    catch (ex) { showErr(ex); }
    finally { btn.disabled = false; }
  });
  onOpen && onOpen(form, d);
  d.showModal();
  return d;
}

function divOptions(selected = ''){
  return S.divs.map(d => `<option value="${esc(d.code)}" ${d.code === selected ? 'selected' : ''}>${esc(d.code + ' ' + d.name)}</option>`).join('');

// Budget line (add or edit)
function calcBox(qty, rate){
  return `<div class="calc"><span class="small muted">Budget = Sq.Ft. / Qty × Rate</span><strong class="num" data-calc>${money(num(qty) * num(rate))}</strong></div>`;
}
function bindCalc(form){
  const v = form.elements;
  const out = form.querySelector('[data-calc]');
  const upd = () => { out.textContent = money(num(v.qty.value) * num(v.rate.value)); };
  v.qty.addEventListener('input', upd);
  v.rate.addEventListener('input', upd);
}
const UNIT_HINTS = ['SF', 'LF', 'EA', 'LS', 'HR', 'CY', 'SY', 'Day', 'Month'];
const unitList = () => `<datalist id="unitList">${UNIT_HINTS.map(u => `<option value="${u}">`).join('')}</datalist>`;

function lineSheet(line){
  const P = S.proj;
  if (line){
    const paidHere = P.pays.filter(p => p.budget_line_id === line.id).reduce((a, p) => a + num(p.amount), 0);
    const custom = !line.subtask_code;
    sheet({
      title: lineName(line),
      html: `<div class="small muted">${esc(divName(line.division_code))}${line.subtask_code ? ' · ' + esc(line.subtask_code) : ''}</div>
        ${unitList()}
        <div class="grid">
          ${custom ? `<label class="full">Line Name<input name="label" value="${esc(line.label)}"></label>` : ''}
          <label>Unit<input name="unit" list="unitList" value="${esc(line.unit)}" placeholder="SF, LF, EA"></label>
          <label>Sq.Ft. / Qty<input type="text" class="money" name="qty" inputmode="decimal" value="${esc(fmtInput(line.qty))}"></label>
          <label>Rate ($)<input type="text" class="money" name="rate" inputmode="decimal" value="${esc(fmtInput(line.rate))}"></label>
          <label class="check"><input type="checkbox" name="bank_funded" ${line.bank_funded ? 'checked' : ''}> Bank Funds This Line</label>
          <label class="full">Notes<input name="notes" value="${esc(line.notes)}" placeholder="Scope, vendor, or reference"></label>
          <label class="full">Revision ($)<input type="text" class="money" name="revision" inputmode="decimal" value="${esc(fmtInput(line.revision))}"></label>
          <label class="full">Reason For Revision<input name="revision_reason" value="${esc(line.revision_reason)}" placeholder="e.g. Change Order 2"></label>
        </div>
        ${calcBox(line.qty, line.rate)}
        <div class="small muted">Paid so far: ${money(paidHere)}. ${paidHere ? 'Lines with payments cannot be deleted.' : ''}</div>`,
      danger: paidHere ? null : {
        label: 'Delete Line',
        run: async () => check(await sb.from('project_lines').delete().eq('id', line.id))
      },
      onOpen: form => bindCalc(form),
      onSubmit: async form => {
        const v = form.elements;
        const rev = num(v.revision.value);
        if (rev !== num(line.revision) && !v.revision_reason.value.trim()) throw new Error('Give a reason for the revision.');
        const qty = num(v.qty.value), rate = num(v.rate.value);
        const row = {
          qty, rate, budget: qty * rate, unit: v.unit.value.trim(), notes: v.notes.value.trim(),
          revision: rev, revision_reason: v.revision_reason.value.trim(), bank_funded: v.bank_funded.checked
        };
        if (custom){
          const label = v.label.value.trim();
          if (!label) throw new Error('Name the line.');
          row.label = label;
        }
        check(await sb.from('project_lines').update(row).eq('id', line.id));
      }
    });
    return;
  }

  sheet({
    title: 'Add Budget Line',
    html: `${unitList()}<div class="grid">
      <label class="full">Division<select name="division_code">${divOptions()}</select></label>
      <label class="full">Sub-Task<select name="subtask_code"></select></label>
      <label class="full" data-custom hidden>Line Name<input name="label" placeholder="e.g. Permit Fee, Unexpected"></label>
      <label>Unit<input name="unit" list="unitList" placeholder="SF, LF, EA"></label>
      <label>Sq.Ft. / Qty<input type="text" class="money" name="qty" inputmode="decimal" value="1"></label>
      <label>Rate ($)<input type="text" class="money" name="rate" inputmode="decimal" value="0"></label>
      <label class="check"><input type="checkbox" name="bank_funded" checked> Bank Funds This Line</label>
      <label class="full">Notes<input name="notes" placeholder="Scope, vendor, or reference"></label>
    </div>
    ${calcBox(1, 0)}`,
    onOpen: (form) => {
      const v = form.elements;
      const fillSubs = () => {
        const code = v.division_code.value;
        const subs = S.subs.filter(s => s.division_code === code);
        v.subtask_code.innerHTML = `<option value="">Custom Line</option>` + subs.map(s => `<option value="${esc(s.code)}">${esc(s.code + ' ' + s.name)}</option>`).join('');
        v.bank_funded.checked = !!S.divMap[code]?.bank_funded;
        toggleCustom();
      };
      const toggleCustom = () => { form.querySelector('[data-custom]').hidden = !!v.subtask_code.value; };
      v.division_code.addEventListener('change', fillSubs);
      v.subtask_code.addEventListener('change', toggleCustom);
      bindCalc(form);
      fillSubs();
    },
    onSubmit: async form => {
      const v = form.elements;
      const sub = v.subtask_code.value || null;
      const label = v.label.value.trim();
      if (!sub && !label) throw new Error('Name the custom line, or pick a sub-task.');
      if (sub && S.proj.lines.some(l => l.subtask_code === sub)) throw new Error('That sub-task is already on this budget.');
      const qty = num(v.qty.value), rate = num(v.rate.value);
      check(await sb.from('project_lines').insert({
        project_id: S.proj.project.id, division_code: v.division_code.value,
        subtask_code: sub, label: sub ? '' : label, unit: v.unit.value.trim(), notes: v.notes.value.trim(),
        qty, rate, budget: qty * rate, bank_funded: v.bank_funded.checked
      }));
    }
  });
}

      const refresh = () => {
        const what = v.what.value.trim().toLowerCase();
        const chosen = v.budget_line_id.value;
        newDiv.hidden = chosen !== 'new';
        const matched = what && P.lines.some(l => lineName(l).toLowerCase().includes(what));

      };
      v.what.addEventListener('input', refresh);
      v.budget_line_id.addEventListener('change', refresh);
      refresh();
    },
    onSubmit: async form => {
      const v = form.elements;
      const amount = num(v.amount.value);
      if (!v.pay_date.value) throw new Error('Enter the payment date.');
      if (!(amount > 0)) throw new Error('Enter the amount.');
      let lineId = v.budget_line_id.value;
      if (!lineId) throw new Error('Not classified. Choose a budget line first. Nothing is saved without one.');
      const projectId = S.proj.project.id;
      if (lineId === 'new'){
        const what = v.what.value.trim();
        if (!what) throw new Error('Describe what this payment is for, so the new line has a name.');
        const code = v.new_division.value;
        const line = check(await sb.from('project_lines').insert({
          project_id: projectId, division_code: code, subtask_code: null, label: what,
          budget: 0, bank_funded: !!S.divMap[code]?.bank_funded
        }).select().single());

        project_id: projectId, vendor_id: v.vendor_id.value || null, budget_line_id: lineId,
        pay_date: v.pay_date.value, amount, method: v.method.value,
        reference: v.reference.value.trim(), invoice_number: v.invoice_number.value.trim()
      }).select().single());
      await attachFiles(`payments/${pay.id}`, pay.id, v.files.files);
    }
  });

    `<optgroup label="${esc(divName(code))}">` +

    `</optgroup>`).join('');

async function attachFiles(folder, paymentId, files){
  for (const f of Array.from(files || [])){
    const path = await uploadFile(folder, f);
    check(await sb.from('payment_receipts').insert({payment_id: paymentId, path, filename: f.name}));
  }
}

async function uploadFile(folder, file){
  const safe = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const path = `${folder}/${Date.now()}-${safe}`;
  const res = await sb.storage.from('receipts').upload(path, file, {contentType: file.type || undefined});
  if (res.error) throw res.error;
  return path;
}

async function openFile(path){
  const res = await sb.storage.from('receipts').createSignedUrl(path, 600);
  if (res.error) throw res.error;
  const a = document.createElement('a');
  a.href = res.data.signedUrl;
  a.target = '_blank';
  a.rel = 'noopener';
  a.click();
}

    submit: 'Save',
    html: `<div class="grid">
        <label>Name<input name="name" required value="${esc(v?.name)}"></label>
        <label>Trade<input name="trade" value="${esc(v?.trade)}" placeholder="Framing, electrical"></label>
        <label>Company<input name="company" value="${esc(v?.company)}"></label>
        <label>Phone<input name="phone" type="tel" value="${esc(v?.phone)}"></label>
        <label class="full">Email<input name="email" type="email" value="${esc(v?.email)}"></label>
        <label class="check full"><input type="checkbox" name="is_corporation" ${v?.is_corporation ? 'checked' : ''}> Corporation (No 1099 Needed)</label>
        <label class="full">W-9 ${v?.w9_path ? '(On File, Upload To Replace)' : '(Missing)'}<input type="file" name="w9" accept="image/*,application/pdf"></label>
      </div>
      ${ledgerHtml}`,
    danger: editing ? {
      label: 'Delete Contractor',
      confirm: 'Delete this contractor? Payments to them stay, but lose the link.',
      run: async () => {
        if (v.w9_path) await sb.storage.from('receipts').remove([v.w9_path]);
        check(await sb.from('vendors').delete().eq('id', v.id));
      }
    } : null,
    onSubmit: async form => {
      const f = form.elements;
      if (!f.name.value.trim()) throw new Error('Enter the contractor name.');
      const row = {
        name: f.name.value.trim(), trade: f.trade.value.trim(), company: f.company.value.trim(),
        phone: f.phone.value.trim(), email: f.email.value.trim(), is_corporation: f.is_corporation.checked
      };
      let id = v?.id;
      if (editing){
        check(await sb.from('vendors').update(row).eq('id', id));
      } else {
        id = check(await sb.from('vendors').insert(row).select().single()).id;
      }
      const w9 = f.w9.files[0];
      if (w9){
        const path = await uploadFile(`w9/${id}`, w9);
        check(await sb.from('vendors').update({w9_path: path}).eq('id', id));
      }
    }
  });
}

function divisionSheet(){
  sheet({
    title: 'New Division',
    html: `<div class="grid">
        <label>Code<input name="code" placeholder="210-000" required></label>
        <label>Name<input name="name" placeholder="Garage" required></label>
        <label class="check full"><input type="checkbox" name="bank_funded" checked> Bank Funds This Division</label>
      </div>
      <div class="small muted">Codes use the form NNN-000, for example 210-000.</div>`,
    onSubmit: async form => {
      const v = form.elements;
      const code = v.code.value.trim();
      if (!/^\d{3}-000$/.test(code)) throw new Error('Use a code like 210-000.');
      if (!v.name.value.trim()) throw new Error('Enter a division name.');
      if (S.divMap[code]) throw new Error('That division already exists.');
      check(await sb.from('library_divisions').insert({code, name: v.name.value.trim(), bank_funded: v.bank_funded.checked, sort_order: 0}));
    }
  });
}

function subtaskSheet(divCode){
  const preview = () => {
    const subs = S.subs.filter(s => s.division_code === divCode);
    const nums = subs.map(s => Number(s.code.slice(4)));
    const n = Math.max(0, ...nums) + 10;
    return `${divCode.slice(0, 3)}-${String(n).padStart(3, '0')}`;
  };
  sheet({
    title: `New Sub-Task · ${divName(divCode)}`,
    html: `<label>Name<input name="name" required placeholder="e.g. Pool heater"></label>
      <div class="small muted">Code will be ${preview()}.</div>`,
    onSubmit: async form => {
      const name = form.elements.name.value.trim();
      if (!name) throw new Error('Enter a name.');
      const code = (() => {
        const subs = S.subs.filter(s => s.division_code === divCode);
        const n = Math.max(0, ...subs.map(s => Number(s.code.slice(4)))) + 10;
        return `${divCode.slice(0, 3)}-${String(n).padStart(3, '0')}`;
      })();
      check(await sb.from('library_subtasks').insert({code, division_code: divCode, name, sort_order: 0}));
    }
  });
}

// ---------- Actions (delegated) ----------
const actions = {
  'sign-out': () => sb.auth.signOut(),
  'new-project': () => projectSheet(null),
  'edit-project': () => projectSheet(S.proj.project),
  'add-line': () => lineSheet(null),
  'edit-line': (t, id) => lineSheet(S.proj.lines.find(l => l.id === id)),
  'new-payment': () => paymentSheet(),
  'open-pay': (t, id) => paymentDetail(S.proj.pays.find(p => p.id === id)),
  'open-file': (t) => openFile(t.dataset.path).catch(e => toast(msg(e), true)),
  'del-receipt': async (t, id) => {
    if (!confirm('Remove this receipt?')) return;
    await sb.storage.from('receipts').remove([t.dataset.path]);
    check(await sb.from('payment_receipts').delete().eq('id', id));
    t.closest('dialog')?.close();
    await render();
  },
  'assign': () => assignSheet(),
  'add-coi': (t, id) => coiSheet(id),
  'dismiss-coi': (t, id) => dismissSheet(id),
  'new-vendor': () => vendorSheet(null),
  'open-vendor': (t, id) => vendorSheet(S.vendors.find(v => v.id === id)),
  'new-division': () => divisionSheet(),
  'new-subtask': (t) => subtaskSheet(t.dataset.code),
  'export-csv': () => exportBudgetCsv()
};

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const fn = actions[t.dataset.act];
  if (!fn) return;
  try { await fn(t, t.dataset.id); }
  catch (ex) { toast(msg(ex), true); }
});

document.addEventListener('input', e => {
  if (e.target.id === 'budgetSearch' && S.proj){
    S.budgetQuery = e.target.value;
    const el = $('#budgetTable');
    if (el) el.innerHTML = budgetBody(S.proj);
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'yearSel'){
    S.year = Number(e.target.value);
    render();
  }
});

// ---------- Routing ----------
function route(){
  const [a, b, c] = location.hash.replace(/^#\/?/, '').split('/');
  if (a === 'project' && b) return {view: 'project', id: b, tab: c || 'budget'};
  if (a === 'library') return {view: 'library'};
  if (a === 'vendors') return {view: 'vendors'};
  return {view: 'projects'};
}

function renderSide(r){
  const link = (href, label, active, kind) => `<a class="${kind}" href="${href}" ${active ? 'aria-current="page"' : ''}>${esc(label)}</a>`;
  let html = `<div class="side-brand"><div class="side-mark">SN</div><div><div class="side-name">SN Square</div><div class="side-sub">Project Tracker</div></div></div>`;
  if (r.view === 'project' && S.proj){
    const pr = S.proj.project;
    const id = pr.id;
    html += `<a href="#/projects" class="back-link">← All Projects</a>
      <div class="side-proj">
        <div class="side-sec" style="padding:0 0 6px">Current Project</div>
        <div class="side-pname">${esc(pr.name)}</div>
        <div class="side-sub">${esc(pr.address || pr.status)}</div>
        <button class="side-btn" data-act="edit-project" style="margin-top:8px">Project Details</button>
      </div>
      <div class="side-group">
        <div class="side-sec">Project</div>
        ${link(`#/project/${id}/budget`, 'Budget', r.tab === 'budget', 'child')}
        ${link(`#/project/${id}/payments`, 'Payments', r.tab === 'payments', 'child')}
        ${link(`#/project/${id}/contractors`, 'Contractors', r.tab === 'contractors', 'child')}
      </div>
      <div class="side-group">
        <div class="side-sec">Shared Across Projects</div>
        ${link('#/library', 'Library', r.view === 'library', 'top')}
        ${link('#/vendors', 'Contractor Directory', r.view === 'vendors', 'top')}
      </div>`;
  } else {
    html += `<div class="side-group">
        <div class="side-sec">Home</div>
        ${link('#/projects', 'All Projects', r.view === 'projects', 'top')}
      </div>
      <div class="side-group">
        <div class="side-sec">Shared Across Projects</div>
        ${link('#/library', 'Library', r.view === 'library', 'top')}
        ${link('#/vendors', 'Contractor Directory', r.view === 'vendors', 'top')}
      </div>`;
  }
  html += `<div class="side-foot"><button class="side-btn" data-act="sign-out">Sign Out</button></div>`;
  $('#side').innerHTML = html;
}

function setNav(r){
  if (r.view !== 'project') renderSide(r);
  const key = r.view === 'project' ? 'projects' : r.view;
  document.querySelectorAll('[data-nav]').forEach(a => {
    if (a.dataset.nav === key) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
}

let rendering = 0;
async function render(){
  if (!session) return;
  const r = route();
  setNav(r);
  const token = ++rendering;
  $('#main').innerHTML = '<p class="muted" style="text-align:center;padding:30px 0">Loading…</p>';
  try {
    if (r.view === 'projects') await renderProjects();
    else if (r.view === 'project') await renderProject(r);
    else if (r.view === 'library') await renderLibrary();
    else if (r.view === 'vendors') await renderVendors();
    if (token !== rendering) return;
  } catch (e) {
    if (token !== rendering) return;
    $('#main').innerHTML = `<div class="notice bad">Could not load: ${esc(msg(e))}</div>`;
  }
}
window.addEventListener('hashchange', render);

// ---------- Sign in and session ----------
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const v = Object.fromEntries(new FormData(e.currentTarget));
  const res = await sb.auth.signInWithPassword({email: v.email.trim(), password: v.password});
  if (res.error){
    $('#loginErr').textContent = res.error.message;
    $('#loginErr').hidden = false;
  }
});

function showSignedIn(on){
  $('#gate').classList.toggle('hidden', on);
  $('#app').classList.toggle('hidden', !on);
}

sb.auth.onAuthStateChange((_event, s) => {
  session = s;
  // Run app queries after the auth callback returns. Awaiting queries inside it can hang in some browsers.
  setTimeout(() => startApp(s), 0);
});

async function startApp(s){
  if (!s){ showSignedIn(false); return; }
  showSignedIn(true);
  try {
    await loadLibrary();
    if (!location.hash) location.hash = '#/projects';
    await render();
  } catch (e) {
    $('#main').innerHTML = `<div class="notice bad">Could not load: ${esc(msg(e))}</div>`;
  }
}
</script>
</body>
</html>
