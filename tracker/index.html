<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SN Square Projects</title>
<style>
:root{
  --navy:#14213D; --teal:#0D9488; --teal-d:#0F766E; --indigo:#4F46E5; --emerald:#059669; --amber:#D97706; --rose:#E11D48;
  --ink:#0F172A; --ink2:#334155; --muted:#64748B; --line:#E2E8F0; --soft:#F1F5F9; --card:#FFFFFF; --bg:#F1F5F9;
  --amber-bg:#FFFBEB; --amber-ink:#92400E; --rose-bg:#FFF1F2; --rose-ink:#BE123C;
  --emerald-bg:#ECFDF5; --emerald-ink:#047857; --indigo-bg:#EEF2FF; --indigo-ink:#4338CA;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:12px} .bad{color:var(--rose-ink)} .warnText{color:var(--amber-ink)}

/* Header and navigation */
.top{background:var(--navy);color:#fff;padding:12px 16px 12px;border-radius:0 0 20px 20px;position:sticky;top:0;z-index:4}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#94A3B8;font-weight:600}
.top h1{margin:4px 0 0;font-size:22px;line-height:1.2;font-weight:700;overflow-wrap:anywhere}
.top .sub{margin:4px 0 0;color:#94A3B8;font-size:13px}
.tabs{display:flex;gap:4px;margin-top:10px;background:rgba(255,255,255,.08);border-radius:12px;padding:4px}
.tabs a{flex:1;text-align:center;text-decoration:none;color:#CBD5E1;padding:7px 6px;border-radius:9px;font-size:14px;font-weight:600;white-space:nowrap}
.tabs a[aria-current="page"]{background:#fff;color:var(--navy)}
.back{color:#94A3B8;text-decoration:none;font-size:13px;font-weight:600}
main{padding:14px 16px 110px;display:flex;flex-direction:column;gap:12px;max-width:1180px;margin:0 auto}
.bottomnav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:4}
.bottomnav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600;padding:6px 0;border-radius:10px}
.bottomnav a[aria-current="page"]{color:var(--teal-d);background:#F0FDFA}

/* Page pieces */
.page-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.page-h h2{margin:0;font-size:18px;font-weight:700}
.section-t{font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:1px;margin:6px 0 -4px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.04);display:flex;flex-direction:column;gap:10px}
.card.clickable{text-decoration:none;color:inherit;display:block}
.g-wrap{background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.04);overflow:auto;max-height:68vh;position:relative}
.g-row{display:flex;height:34px;border-bottom:1px solid var(--soft);width:max-content;min-width:100%;box-sizing:border-box}
.g-row.g-click{cursor:pointer}
.g-row.g-click:hover>*{background:#F8FAFC}
.g-left{position:sticky;left:0;z-index:2;flex:0 0 540px;width:540px;display:flex;align-items:center;background:var(--card);border-right:1px solid var(--line);font-size:13px;box-sizing:border-box}
.g-row.g-kind-div .g-left{background:#F1F5F9;font-weight:700}
.g-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-bud{width:100px;text-align:right;padding-right:12px}
.g-st{width:84px;text-align:right;padding-right:12px}
.g-days{width:56px;text-align:right;padding-right:12px}
.g-pct{width:116px;display:flex;align-items:center;gap:8px;padding:0 12px;box-sizing:border-box}
.g-mini{flex:1;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.g-mini i{display:block;height:100%;background:var(--teal)}
.g-right{position:relative;flex:0 0 auto;height:100%}
.g-row.g-kind-div{background:#F1F5F9}
.g-row.g-kind-div .g-left{background:#F1F5F9}
.g-bar{position:absolute;top:9px;height:16px;border-radius:5px;background:#99F6E4;overflow:hidden}
.g-bar i{display:block;height:100%;background:#0D9488}
.g-bar.g-sum{top:11px;height:12px;background:#334155}
.g-bar.g-sum i{display:none}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:#E11D48;opacity:.55}
.g-row.g-head{position:sticky;top:0;z-index:4;height:26px;background:var(--card);border-bottom:0}
.g-row.g-sub{position:sticky;top:26px;z-index:4;height:26px;background:var(--card);border-bottom:1px solid var(--line)}
.g-head .g-left,.g-sub .g-left{background:var(--card);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.g-hdr{display:flex;overflow:hidden;height:100%}
.g-mon{font-size:11px;font-weight:700;color:var(--ink2);border-left:1px solid var(--line);padding-left:6px;line-height:26px;overflow:hidden;white-space:nowrap;box-sizing:border-box;flex:none}
.g-day{font-size:10px;color:var(--muted);text-align:center;line-height:26px;flex:none}
.look{gap:8px;margin:12px 0 16px}
.look .card-h>div{white-space:nowrap}
.look select{width:auto;min-width:150px;flex:none;font:inherit;font-size:14px;font-weight:600;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.page-h .tx-add-btn{display:none}
@media (max-width:640px){.page-h .tx-add-btn{display:inline-flex}}
.tx-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tx-tools .tx-q{flex:1 1 220px;margin:0}
.tx-tools select{width:auto;flex:0 0 auto;padding:8px 10px;font:inherit;font-size:14px}
.tx-q{width:100%;margin-bottom:12px}
.tx-draft td{background:#F0FDFA;padding:6px 8px;vertical-align:middle}
.tx-draft input,.tx-draft select{width:100%;min-width:80px;font:inherit;font-size:13px;padding:6px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.tx-draft .hint{font-size:11px;color:var(--muted);margin-top:2px;min-height:0}
.tx-draft .small{font-size:13px}
.tx-edit td{padding:4px 6px;vertical-align:middle}
.tx-edit input,.tx-edit select{width:100%;min-width:80px;font:inherit;font-size:13px;padding:6px 6px;border:1px solid #E2E8F0;border-radius:8px;background:#fff;color:var(--ink)}
.tx-edit input:hover,.tx-edit select:hover{border-color:#94A3B8}
.tx-edit input:focus,.tx-edit select:focus{border-color:var(--teal);background:#fff;outline:none}
.tx-edit input.r{text-align:right}
.tx-edit td:nth-child(2){width:96px}
.tx-edit td:nth-child(3) select{min-width:140px}
.tx-edit td:nth-child(4) input{min-width:140px}
.tx-edit td:nth-child(5) input{min-width:110px}
.tx-edit td:nth-child(6) select{min-width:80px}
.tx-edit td:nth-child(7) input{min-width:90px}
.tx-edit td:nth-child(1) input{min-width:0;width:112px}
.tx-unc td{background:#FEF9C3}
.link-btn{background:none;border:0;color:var(--teal-d);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:4px 6px}
.tx-edit select{padding-right:4px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;background:none;border:1px solid transparent;border-radius:8px;padding:6px;color:#94A3B8;cursor:pointer}
.icon-btn:hover{border-color:var(--line);color:var(--ink2)}
.icon-btn.has{color:#059669}
.tx-icons{white-space:nowrap}
.sheet textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;resize:vertical}
.bud-tbl th,.bud-tbl td{padding-left:8px;padding-right:8px;white-space:nowrap}
.sheet-tbl.bud-tbl td.desc,.sheet-tbl.bud-tbl th.desc{white-space:normal;min-width:120px;max-width:150px}
.bud-tbl td.code,.bud-tbl th.code{white-space:nowrap}
.tx-tbl th,.tx-tbl td{padding-left:8px;padding-right:8px}
.tx-tbl tfoot td{font-weight:700;border-top:2px solid var(--line)}
.tx-tbl td.num{white-space:nowrap}
/* Budget as a spreadsheet: sticky header, compact rows, inline entry row */
.bud-wrap{max-height:calc(100vh - 250px);overflow:auto}
.bud-wrap thead tr:first-child th{position:sticky;top:0;z-index:3}
.bud-wrap thead tr:nth-child(2) th{position:sticky;top:30px;z-index:3;background:#F1F5F9;border-bottom:1px solid #CBD5E1}
.bud-wrap .bud-tbl tbody td{height:28px;padding:2px 4px;border-bottom:1px solid #E2E8F0;border-right:1px solid #EEF2F6;vertical-align:middle}
.bud-wrap .bud-tbl tr.grp td{background:#F8FAFC;font-weight:600}
.bud-wrap .bud-tbl tr.item:hover td{background:#F8FAFC;cursor:pointer}
.bud-wrap .bud-tbl tr.tr-grand td{position:sticky;bottom:0;background:#F1F5F9;border-top:2px solid #CBD5E1}
.bud-entry td{background:#ECFDF5;padding:2px 3px;height:32px;border-bottom:2px solid #A7F3D0;vertical-align:middle}
.bud-entry input,.bud-entry select{height:26px;font-size:13px;padding:0 6px;width:100%;min-width:0;border:1px solid #D1FAE5;border-radius:3px;background:#fff;color:var(--ink)}
.bud-entry input[type=checkbox]{width:auto;height:auto;margin:0}
.bud-tbl.no-bank th:last-child,.bud-tbl.no-bank td:last-child{display:none}
.bud-tbl{table-layout:fixed;width:100%}
.bud-wrap .bud-tbl tr.item td,.bud-wrap .bud-tbl tr.grp td,.bud-wrap .bud-tbl tr.tr-grand td{height:28px;padding-top:0;padding-bottom:0;line-height:1.25;vertical-align:middle}
.bud-wrap .bud-tbl td.desc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-tbl.bud-tbl td.desc,.sheet-tbl.bud-tbl th.desc{min-width:0;max-width:none}
.bud-wrap .bud-tbl .bud-name{display:inline-block;max-width:calc(100% - 22px);overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.bud-wrap .bud-tbl .bud-note{display:inline-flex;vertical-align:middle;color:#059669;margin-left:4px}
.bud-wrap .bud-tbl .bud-note svg{width:14px;height:14px}
.bud-tbl thead tr.band th.gh{border-bottom:2px solid #5EEAD4;padding-top:6px}
.bud-tbl .g-start{border-left:2px solid #CBD5E1}
.bud-tbl thead tr.band th.g-start{border-left:1px solid rgba(255,255,255,.35)}
.bud-tbl td:nth-child(8),.bud-tbl td:nth-child(9),.bud-tbl th:nth-child(8),.bud-tbl th:nth-child(9){width:96px;min-width:96px;max-width:96px}
.bud-tbl .caret{display:inline-block;width:14px;color:var(--teal-d);font-size:11px}
.bud-tbl .line-del{float:right;padding:0 2px;margin:2px 0 0 4px;opacity:.5}
.bud-tbl tr.item:hover .line-del{opacity:1}
.bud-tbl .var-neg{color:#B91C1C;font-weight:600}
.bud-tbl .var-pos{color:inherit}
.bud-wrap .bud-tbl tr.grp{cursor:pointer}
.bud-wrap .bud-tbl tr.grp:hover td{background:#E8F3F1}
.bud-entry input:focus,.bud-entry select:focus{border-color:var(--teal);outline:none;box-shadow:inset 0 0 0 1px var(--teal)}
.bud-entry td:nth-child(1) select{width:100px}
.bud-entry td:nth-child(2) select{width:100%;min-width:120px}
.bud-entry td:nth-child(3) select{width:60px;padding:0 2px}
.bud-entry td:nth-child(6) input,.bud-entry td:nth-child(7) input{width:92px;font-size:11px;padding:0 2px}
.bud-entry td:nth-child(4) input,.bud-entry td:nth-child(5) input{width:64px}
.bud-entry td:nth-child(8){white-space:nowrap}
.bud-wrap .bud-tbl tr.tr-grand td{color:var(--ink)}
.tx-no{color:var(--muted);font-size:12px;width:44px}
/* Excel-style grid: compact rows, grey sticky header, cells with light gridlines */
.tx-wrap{max-height:calc(100vh - 230px);overflow:auto}
.tx-tbl{border-collapse:separate;border-spacing:0}
.tx-tbl thead th{position:sticky;top:0;z-index:3;background:#F1F5F9;border-bottom:1px solid #CBD5E1;border-right:1px solid #E2E8F0;padding:6px 8px;font-size:11px;line-height:1.2;white-space:nowrap}
.tx-tbl thead th:last-child{border-right:0}
.tx-tbl tbody td{border-bottom:1px solid #E2E8F0;border-right:1px solid #EEF2F6;vertical-align:middle}
.tx-tbl tbody td:last-child{border-right:0}
.tx-tbl .tx-draft td{background:#ECFDF5;height:32px;padding:2px 3px;border-bottom:2px solid #A7F3D0}
.tx-tbl .tx-edit td{height:28px;padding:0 3px}
.tx-tbl .tx-edit:hover td{background:#F8FAFC}
.tx-tbl .tx-edit input,.tx-tbl .tx-edit select,.tx-tbl .tx-draft input,.tx-tbl .tx-draft select{height:26px;padding:0 6px;font-size:13px;border:1px solid transparent;border-radius:3px;background:transparent}
.tx-tbl .tx-draft input,.tx-tbl .tx-draft select{background:#fff;border-color:#D1FAE5}
.tx-tbl .tx-edit input:hover,.tx-tbl .tx-edit select:hover{border-color:#CBD5E1;background:#fff}
.tx-tbl .tx-edit input:focus,.tx-tbl .tx-edit select:focus,.tx-tbl .tx-draft input:focus,.tx-tbl .tx-draft select:focus{border-color:var(--teal);background:#fff;outline:none;box-shadow:inset 0 0 0 1px var(--teal)}
.tx-tbl .tx-unc td{background:#FEF9C3}
.tx-tbl .tx-unc:hover td{background:#FEF08A}
.tx-tbl .icon-btn,.tx-tbl .link-btn{padding:2px 4px}
.tx-tbl tfoot td{position:sticky;bottom:0;z-index:3;background:#F1F5F9;border-top:2px solid #CBD5E1;height:auto;padding:6px 8px}
.tx-cards{display:none}
@media (max-width:640px){
  .tx-wrap{display:none}
  .tx-cards{display:block}
  .tx-q{margin-bottom:10px}
}
.la-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--soft);font-size:14px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card-h strong{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.05);overflow:hidden}
.strip>div{padding:12px 14px;border-left:1px solid var(--soft);min-width:0}
.strip>div:first-child{border-left:0}
.strip .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .small{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .warnText{color:var(--amber-ink)}
.strip.teal{background:var(--teal)}
@media (max-width:560px){ .strip{grid-template-columns:repeat(2,minmax(0,1fr))} .strip>div:nth-child(3){border-left:0} .strip>div:nth-child(n+3){border-top:1px solid var(--soft)} }
.tile{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.tile .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.tile .v{font-size:19px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.tile.teal{background:var(--teal);color:#fff} .tile.teal .l{color:#CCFBF1}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--teal);border-radius:999px}
.bar.ok>i{background:var(--emerald)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--soft);color:var(--ink2)}
.b-ok{background:var(--emerald-bg);color:var(--emerald-ink)}
.b-warn{background:var(--amber-bg);color:var(--amber-ink)}
.b-bad{background:var(--rose-bg);color:var(--rose-ink)}
.b-info{background:var(--indigo-bg);color:var(--indigo-ink)}
.b-mute{background:var(--soft);color:var(--muted)}
.notice{border-radius:12px;padding:10px 12px;font-size:13px;background:var(--amber-bg);color:var(--amber-ink);border:1px solid #FDE68A}
.notice.bad{background:var(--rose-bg);color:var(--rose-ink);border-color:#FECDD3}
.notice.ok{background:var(--emerald-bg);color:var(--emerald-ink);border-color:#A7F3D0}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--soft);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;cursor:pointer}
.row:first-child{border-top:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.row .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto 14px;gap:2px 12px;padding:10px 0;border-top:1px solid var(--soft);font-size:13px;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer;align-items:center}
.line .n{overflow-wrap:anywhere;color:var(--ink)}
.line .c{font-size:12px;color:var(--muted)}
.line .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.line .chev{color:var(--teal-d);font-size:18px;line-height:1;font-weight:700}
.hint-line{font-size:12px;color:var(--muted);margin-top:2px}
.sheet-tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px;font-variant-numeric:tabular-nums}
.sheet-tbl th,.sheet-tbl td{padding:8px 10px;border-bottom:1px solid var(--soft);text-align:left;white-space:nowrap;vertical-align:middle}
.sheet-tbl thead th{background:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;position:sticky;top:0;border-bottom:1px solid var(--line)}
.sheet-tbl thead tr.band th{background:var(--navy);color:#fff;text-align:center;font-size:11px;letter-spacing:.8px;border-bottom:1px solid #2B3A5E}
.sheet-tbl .r{text-align:right}
.sheet-tbl .ctr{text-align:center}
.sheet-tbl td.code{width:86px;color:var(--muted);font-weight:600}
.sheet-tbl td.desc{min-width:240px}
.sheet-tbl td.wrap{white-space:normal}
.sheet-tbl tr.item td.desc{padding-left:26px}
.sheet-tbl tr.item td{vertical-align:top;padding-top:10px;padding-bottom:10px}
.sheet-tbl tr.grp td{background:#E8F3F1;font-weight:700;color:var(--navy);border-top:1px solid #CFE7E3;padding-top:10px;padding-bottom:10px}
.sheet-tbl tr.grp td.code{color:var(--teal-d)}
.sheet-tbl tr.grp td.desc{text-transform:uppercase;letter-spacing:.3px;font-size:12px}
.sheet-tbl tr.tr-click{cursor:pointer}
.sheet-tbl tr.tr-click:hover td{background:#F8FAFC}
.sheet-tbl tr.tr-grand td{background:var(--navy);color:#fff;font-weight:700;border-bottom:0}
@media (max-width:640px){
  .sheet-tbl, .sheet-tbl tbody{display:block;min-width:0}
  .sheet-tbl thead{display:none}
  .sheet-tbl tr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--soft)}
  .sheet-tbl td{display:none;border:0;padding:0;white-space:normal;min-width:0}
  .sheet-tbl td.m-name,.sheet-tbl td.m-amt,.sheet-tbl td.m-meta,.sheet-tbl td.m-owed{display:block}
  .sheet-tbl tr.item{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name amt" "meta owed";gap:2px 12px}
  .sheet-tbl tr.item td.m-name{grid-area:name;font-weight:600;padding-left:0}
  .sheet-tbl tr.item td.m-amt{grid-area:amt;text-align:right;font-weight:700}
  .sheet-tbl tr.item td.m-meta{grid-area:meta;color:var(--muted);font-size:12px}
  .sheet-tbl tr.item td.m-owed{grid-area:owed;text-align:right;font-size:12px;color:var(--muted)}
  .sheet-tbl tr.grp{background:#E8F3F1;justify-content:space-between;padding:10px 14px}
  .sheet-tbl tr.grp td.m-name{flex:1 1 55%;font-size:12px}
  .sheet-tbl tr.grp td.m-amt{font-weight:700;color:var(--navy)}
  .sheet-tbl tr.grp td.m-owed{font-size:12px;color:var(--muted)}

}
.note{font-size:12px;color:var(--muted);font-weight:400;white-space:normal;margin-top:2px}
.calc{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--soft);border-radius:12px;padding:12px 14px}

.line-h{display:grid;grid-template-columns:minmax(0,1fr) auto auto 14px;gap:12px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;padding-top:6px}
.line-h span:not(:first-child){text-align:right}
details{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 1px 2px rgba(15,23,42,.05)}

/* Buttons and fields */
.btn{padding:11px 14px;border:1px solid var(--line);background:#fff;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--navy);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}

.empty{background:var(--card);border-radius:16px;padding:22px 16px;text-align:center;color:var(--muted);box-shadow:0 1px 2px rgba(15,23,42,.05)}
input,select{width:100%;padding:11px 12px;border:1px solid #CBD5E1;border-radius:12px;background:#fff;font-size:16px;min-width:0}
input[type=checkbox]{width:auto;padding:0;accent-color:var(--teal)}

input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.seg{display:flex;gap:4px;background:var(--line);border-radius:12px;padding:4px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:9px 10px;border-radius:9px;font-weight:600;font-size:13px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}

/* Sheet (bottom sheet on phone, dialog on wide screens) */
dialog.sheet{border:0;border-radius:18px;padding:0;width:min(620px,calc(100vw - 24px));max-height:92vh;overflow:auto;color:var(--ink);background:#fff;box-shadow:0 20px 50px rgba(15,23,42,.3)}
dialog.sheet::backdrop{background:rgba(15,23,42,.5)}
dialog.sheet form{display:flex;flex-direction:column;gap:14px;padding:18px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}

.file-li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--soft);font-size:14px}

@media (max-width:600px){
  dialog.sheet{position:fixed;margin:0;top:auto;bottom:0;left:0;right:0;width:100%;max-width:none;max-height:92vh;border-radius:18px 18px 0 0}
}

/* Toast */
.toast{position:fixed;left:16px;right:16px;bottom:84px;max-width:560px;margin:0 auto;background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;z-index:6;box-shadow:0 10px 30px rgba(15,23,42,.3)}

/* Desktop app shell */
.side{display:none}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

@media (min-width:900px){
  .side{box-sizing:border-box;display:flex;flex-direction:column;gap:18px;position:fixed;left:0;top:0;bottom:0;width:232px;background:var(--navy);color:#fff;padding:20px 14px;overflow:auto;overflow-x:hidden;z-index:5}
  .side>*{min-width:0;margin-left:0;margin-right:0}

  .side-group>.side-sec:first-child{margin-top:0}
  .side-btn{width:100%;margin-top:6px;padding:9px 12px;border-radius:10px;border:1px solid #334155;background:transparent;color:#CBD5E1;font-weight:600;font-size:13px;cursor:pointer;text-align:left}

  .shell{margin-left:232px;min-height:100vh}

}

.gate{max-width:380px;margin:12vh auto 0;padding:0 16px}
.gate .card{margin-top:10px}
.hidden{display:none !important}
</style>
</head>
<body>

<!-- Sign-in -->
<section id="gate" class="gate hidden">
  <div class="brand">SN Square Group</div>
  <h1 style="margin:6px 0 0;font-size:24px;color:var(--navy)">Project Tracker</h1>
  <div class="card">
    <form id="loginForm" style="display:flex;flex-direction:column;gap:12px">
      <label>Email<input type="email" name="email" autocomplete="username" required></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn navy" type="submit">Sign In</button>
      <p class="err" id="loginErr" hidden></p>
    </form>
  </div>
</section>

<!-- App shell -->
<div id="app" class="hidden">
  <aside class="side" id="side"></aside>
  <div class="shell">
    <header class="top" id="topbar"></header>
    <main id="main"></main>
    <nav class="bottomnav" id="bottomnav">
      <a href="#/projects" data-nav="projects">Projects</a>
      <a href="#/library" data-nav="library">Library</a>
      <a href="#/vendors" data-nav="vendors">Contractors</a>
    </nav>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../config.js"></script>
<script>
'use strict';

// ---------- Helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (v === '' || v == null) return 0; const n = Number(String(v).replace(/[$,\s]/g, '')); return Number.isFinite(n) ? n : 0; };
const money = n => Number(n || 0).toLocaleString('en-US', {style:'currency', currency:'USD', minimumFractionDigits:0, maximumFractionDigits:2});
const fmtInput = n => (n === '' || n == null) ? '' : Number(n).toLocaleString('en-US', {maximumFractionDigits:2});
function formatMoneyText(raw){
  const cleaned = String(raw).replace(/[^0-9.]/g, '');
  if (!cleaned) return '';
  const parts = cleaned.split('.');
  const whole = (parts[0] || '').replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const dec = parts.length > 1 ? '.' + parts.slice(1).join('').slice(0, 2) : '';
  return whole + dec;
}
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fmtDate = s => s ? new Date(s + 'T12:00:00').toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}) : '—';
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
const msg = e => (e && (e.message || e.error_description)) || String(e);
const pct = (a, b) => b > 0 ? Math.min(100, Math.round(a / b * 100)) : 0;

const DISMISS_REASONS = [
  'Vendor has no employees (owner-operator)',
  'Covered under another policy or umbrella',
  'Vendor is not doing work on site',
  'Owner is handling insurance for this scope',
  'Other (explain below)'
];
const PAY_METHODS = ['Check', 'ACH', 'Wire', 'Cash', 'Card'];
const PROJECT_STATUS = ['Planning', 'Active', 'Sold'];

const sb = supabase.createClient(window.TRACKER_CONFIG.url, window.TRACKER_CONFIG.anonKey);
let session = null;

// Library cache (global) and current project cache
const S = { divs: [], subs: [], divMap: {}, subMap: {}, vendors: [], proj: null, year: new Date().getFullYear() };

function setLibrary(divs, subs){
  S.divs = divs; S.subs = subs;
  S.divMap = Object.fromEntries(divs.map(d => [d.code, d]));
  S.subMap = Object.fromEntries(subs.map(s => [s.code, s]));
}
const divName = code => S.divMap[code] ? `${code} ${S.divMap[code].name}` : code;
const lineName = l => l.subtask_code ? (S.subMap[l.subtask_code]?.name || l.subtask_code) : (l.label || 'Custom line');
// Total = signed contract when one is entered; until then, budget plus any revision.
const budgetOf = l => num(l.contract_amount) > 0 ? num(l.contract_amount) : num(l.budget) + num(l.revision);
const dateOr = s => s ? toDate(s).toLocaleDateString('en-US', {month:'numeric', day:'numeric', year:'2-digit'}) : '';

function toast(text, bad = false){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  t.textContent = text;
  document.body.append(t);
  setTimeout(() => t.remove(), 5000);
}

function check(res){ if (res.error) throw res.error; return res.data; }

// Certificate of insurance status for one vendor on one project
function latestInsMap(rows){
  const m = {};
  rows.forEach(r => { const k = r.vendor_id + '|' + r.project_id; if (!(k in m)) m[k] = r; });
  return m;
}
function coiStatus(r){
  if (!r) return 'missing';
  if (r.dismissed_reason) return 'dismissed';
  if (!r.file_path) return 'missing';
  if (r.expires_on && r.expires_on < todayISO()) return 'expired';
  if (r.expires_on && daysBetween(todayISO(), r.expires_on) <= 30) return 'soon';
  return 'ok';
}
const COI_BADGE = {
  missing: ['b-bad', 'COI missing'], expired: ['b-bad', 'COI expired'], soon: ['b-warn', 'COI expiring soon'],
  ok: ['b-ok', 'COI on file'], dismissed: ['b-mute', 'Reminder dismissed']
};
const coiBadge = st => `<span class="badge ${COI_BADGE[st][0]}">${COI_BADGE[st][1]}</span>`;

// ---------- Library (global) ----------
async function loadLibrary(){
  const [d, s] = await Promise.all([
    sb.from('library_divisions').select('*').eq('retired', false).order('code'),
    sb.from('library_subtasks').select('*').eq('retired', false).order('code')
  ]);
  setLibrary(check(d), check(s));
}

// ---------- Projects list ----------
async function renderProjects(){
  const [p, l, pay, pv, ins] = await Promise.all([
    sb.from('projects').select('*').order('created_at', {ascending:false}),
    sb.from('project_lines').select('project_id, division_code, subtask_code, label, budget, revision, bank_funded, id'),
    sb.from('payments').select('project_id, amount'),
    sb.from('project_vendors').select('project_id, vendor_id, vendors(name)'),
    sb.from('vendor_insurance').select('*').order('created_at', {ascending:false})
  ]);
  const projects = check(p), lines = check(l), pays = check(pay), pvs = check(pv), insRows = check(ins);
  const insMap = latestInsMap(insRows);

  const reminders = [];
  pvs.forEach(row => {
    const st = coiStatus(insMap[row.vendor_id + '|' + row.project_id]);
    if (st === 'missing' || st === 'expired'){
      reminders.push({projectId: row.project_id, vendor: row.vendors?.name || 'Contractor', st});
    }
  });
  const projName = Object.fromEntries(projects.map(x => [x.id, x.name]));

  let html = `
    <div class="page-h">
      <h2>Projects</h2>
      <button class="btn primary" data-act="new-project">New Project</button>
    </div>`;

  if (reminders.length){
    html += `<div class="notice bad"><strong>${reminders.length} contractor${reminders.length > 1 ? 's' : ''} need a certificate of insurance.</strong>
      <div style="margin-top:6px">${reminders.map(r => `<div><a href="#/project/${r.projectId}/contractors" style="color:inherit">${esc(r.vendor)} · ${esc(projName[r.projectId] || 'Project')}</a></div>`).join('')}</div>
      <div class="small" style="margin-top:6px">This reminder shows every day until the certificate is added or dismissed with a reason.</div></div>`;
  }

  if (!projects.length){
    html += `<div class="empty">No projects yet. Create one to start the budget.</div>`;
  }

  projects.forEach(pr => {
    const ls = lines.filter(x => x.project_id === pr.id);
    const budget = ls.reduce((a, x) => a + budgetOf(x), 0);
    const paid = pays.filter(x => x.project_id === pr.id).reduce((a, x) => a + num(x.amount), 0);
    const owed = Math.max(0, budget - paid);
    const missing = reminders.filter(r => r.projectId === pr.id).length;
    html += `
      <a class="card clickable" href="#/project/${pr.id}/budget">
        <div class="card-h"><strong>${esc(pr.name)}</strong><span class="badge ${pr.status === 'Active' ? 'b-info' : ''}">${esc(pr.status)}</span></div>
        ${pr.address ? `<div class="small muted">${esc(pr.address)}</div>` : ''}
        <div class="bar ${budget && paid >= budget ? 'ok' : ''}"><i style="width:${pct(paid, budget)}%"></i></div>
        <div class="card-h" style="font-size:13px">
          <span class="muted">Budget <span class="num" style="color:var(--ink)">${money(budget)}</span></span>
          <span class="muted">Paid <span class="num" style="color:var(--ink)">${money(paid)}</span></span>
          <span class="muted">Owed <span class="num" style="color:var(--ink)">${money(owed)}</span></span>
        </div>
        ${missing ? `<span class="badge b-bad" style="align-self:flex-start">${missing} COI missing</span>` : ''}
      </a>`;
  });

  $('#main').innerHTML = html;
  setTopbar('SN Square Group', 'Projects', `${projects.length} project${projects.length === 1 ? '' : 's'}`, '');
}

// ---------- Project shell ----------
async function loadProject(id){
  const [p, l, pay, pv, ins, v, tk] = await Promise.all([
    sb.from('projects').select('*').eq('id', id).single(),
    sb.from('project_lines').select('*').eq('project_id', id).order('created_at'),
    sb.from('payments').select('*, vendors(name)').eq('project_id', id).order('pay_date', {ascending:false}),
    sb.from('project_vendors').select('vendor_id').eq('project_id', id),
    sb.from('vendor_insurance').select('*').eq('project_id', id).order('created_at', {ascending:false}),
    sb.from('vendors').select('*').order('name'),
    sb.from('schedule_tasks').select('*').eq('project_id', id).order('start_date')
  ]);
  const pays = check(pay);
  const ids = pays.map(x => x.id);
  const receipts = ids.length ? check(await sb.from('payment_receipts').select('*').in('payment_id', ids).order('created_at')) : [];
  S.vendors = check(v);
  S.proj = {
    project: check(p),
    lines: check(l),
    pays,
    receipts,
    assignedIds: new Set(check(pv).map(x => x.vendor_id)),
    insMap: latestInsMap(check(ins)),
    tasks: tk.error ? [] : (tk.data || []),
    tasksError: tk.error ? tk.error.message : ''
  };
}

async function renderProject(r){
  await loadProject(r.id);
  renderSide(r);
  const P = S.proj;
  const pr = P.project;
  setTopbar(pr.name, pr.address || '', `${pr.status}${pr.general_contractor ? ' · GC: ' + pr.general_contractor : ''}`, `
    <a href="#/projects" class="back">← Projects</a>
    <div class="tabs" role="tablist">
      <a href="#/project/${pr.id}/budget" ${r.tab === 'budget' ? 'aria-current="page"' : ''}>Budget</a>
      <a href="#/project/${pr.id}/schedule" ${r.tab === 'schedule' ? 'aria-current="page"' : ''}>Schedule</a>
      <a href="#/project/${pr.id}/payments" ${r.tab === 'payments' ? 'aria-current="page"' : ''}>Transactions</a>
      <a href="#/project/${pr.id}/contractors" ${r.tab === 'contractors' ? 'aria-current="page"' : ''}>Contractors</a>
      <a href="#/project/${pr.id}/reports" ${r.tab === 'reports' ? 'aria-current="page"' : ''}>Reports</a>
      <a href="#/project/${pr.id}/files" ${r.tab === 'files' ? 'aria-current="page"' : ''}>Files</a>
    </div>`);
  if (r.tab === 'payments') renderPayments(P);
  else if (r.tab === 'contractors') renderContractors(P);
  else if (r.tab === 'reports') renderReports(P);
  else if (r.tab === 'files') renderFiles(P);
  else if (r.tab === 'schedule') await renderSchedule(P);
  else renderBudget(P);
}

function setTopbar(brand, title, sub, extra){
  $('#topbar').innerHTML = `
    <div class="top-row">
      <div class="brand">${esc(brand)}</div>
      <button class="btn sm" data-act="sign-out" style="background:transparent;color:#CBD5E1;border-color:#334155">Sign Out</button>
    </div>
    <h1>${esc(title)}</h1>
    ${sub ? `<p class="sub">${esc(sub)}</p>` : ''}
    ${extra || ''}`;
}

// ---------- Budget ----------
function paidByLine(P){
  const m = {};
  P.pays.forEach(p => { m[p.budget_line_id] = (m[p.budget_line_id] || 0) + num(p.amount); });
  return m;
}

function budgetGroups(P){
  const q = (S.budgetQuery || '').trim().toLowerCase();
  const lines = q ? P.lines.filter(l => [lineName(l), l.subtask_code, l.division_code, divName(l.division_code), l.unit, l.notes]
    .some(x => String(x || '').toLowerCase().includes(q))) : P.lines;
  const byDiv = {};
  lines.forEach(l => { (byDiv[l.division_code] ||= []).push(l); });
  return {byDiv, codes: Object.keys(byDiv).sort(), filtered: !!q};
}

function renderBudget(P){
  const paid = paidByLine(P);
  const totalBudget = P.lines.reduce((a, l) => a + num(l.budget), 0);
  const totalContract = P.lines.reduce((a, l) => a + budgetOf(l), 0);
  const totalPaid = P.pays.reduce((a, p) => a + num(p.amount), 0);
  const bankBudget = P.lines.filter(l => l.bank_funded).reduce((a, l) => a + budgetOf(l), 0);
  const notBank = totalContract - bankBudget;
  const divCount = new Set(P.lines.map(l => l.division_code)).size;

  let html = `
    <div class="strip">
      <div><div class="l">Total Budget</div><div class="v">${money(totalBudget)}</div></div>
      <div><div class="l">Paid Out</div><div class="v">${money(totalPaid)}</div></div>
      <div><div class="l">Still Owed</div><div class="v warnText">${money(totalContract - totalPaid)}</div></div>
      <div><div class="l">Bank Funded</div><div class="v">${money(bankBudget)}</div>${notBank ? `<div class="small muted">${money(notBank)} not bank funded</div>` : ''}</div>
    </div>
    <div class="page-h">
      <div>
        <h2>Budget</h2>
        <div class="small muted">${divCount} division${divCount === 1 ? '' : 's'} · ${P.lines.length} line${P.lines.length === 1 ? '' : 's'}</div>
      </div>
      <div class="toolbar">
        <input type="search" id="budgetSearch" placeholder="Search lines, codes, notes" value="${esc(S.budgetQuery || '')}" aria-label="Search budget lines">
        <label class="check small" style="margin:0 4px"><input type="checkbox" id="showBank" ${S.showBank ? 'checked' : ''}> Show Bank Funded</label>
        <button class="btn sm" data-act="export-csv">Export CSV</button>
        <button class="btn primary sm" data-act="add-line">+ Budget Line</button>
      </div>
    </div>`;

  if (!P.lines.length){
    html += `<div class="small muted" style="margin:-4px 0 10px">No budget yet. Enter the first line in the row below, or pick sub-tasks from the Library.</div>
      <div id="budgetTable">${budgetTableHtml(P, {}, {}, [], false)}</div>`;
    $('#main').innerHTML = html;
    return;
  }
  html += `<div id="budgetTable">${budgetBody(P)}</div>`;
  $('#main').innerHTML = html;
}

function budgetBody(P){
  const {byDiv, codes, filtered} = budgetGroups(P);
  if (!codes.length){
    return `<div class="empty">No lines match “${esc(S.budgetQuery)}”.</div>`;
  }
  return budgetTableHtml(P, paidByLine(P), byDiv, codes, filtered);
}

// ---------- Budget spreadsheet view ----------
function fmtQty(n){ return Number(n || 0).toLocaleString('en-US', {maximumFractionDigits: 2}); }

function budgetTableHtml(P, paid, byDiv, codes, filtered){
  const body = [];
  let gBud = 0, gTot = 0, gPaid = 0;
  const collapsed = S.collapsedDivs || (S.collapsedDivs = new Set());
  // Variance = Budget minus Total. Negative (red, in brackets) means the total is over the budget.
  const varHtml = v => v < -0.005 ? `<span class="var-neg">(${money(-v)})</span>` : `<span class="var-pos">${money(v)}</span>`;
  codes.forEach(code => {
    const ls = byDiv[code];
    const dBud = ls.reduce((a, l) => a + num(l.budget), 0);
    const dTot = ls.reduce((a, l) => a + budgetOf(l), 0);
    const dPaid = ls.reduce((a, l) => a + (paid[l.id] || 0), 0);
    const dates = ls.map(l => taskForLine(P, l.id)).filter(Boolean);
    const dStart = dates.map(t => t.start_date).sort()[0];
    const dEnd = dates.map(t => t.end_date).sort().slice(-1)[0];
    const isC = collapsed.has(code);
    body.push(`<tr class="grp" data-act="toggle-div" data-code="${esc(code)}" title="Show or hide the sub-tasks">
      <td class="code"><span class="caret">${isC ? '▸' : '▾'}</span>${esc(code)}</td>
      <td class="desc m-name">${esc((S.divMap[code]?.name || 'Unnamed Division').toUpperCase())}</td>
      <td class="g-start"></td><td></td><td></td>
      <td class="g-start">${dateOr(dStart)}</td><td>${dateOr(dEnd)}</td>
      <td class="r g-start">${money(dBud)}</td><td class="r">${money(dTot)}</td>
      <td class="r g-start">${money(dPaid)}</td><td class="r m-owed">${money(dTot - dPaid)}</td><td class="r var">${varHtml(dBud - dTot)}</td>
      <td class="g-start"></td>
    </tr>`);
    ls.forEach(l => {
      const bl = budgetOf(l), lp = paid[l.id] || 0;
      const t = taskForLine(P, l.id);
      body.push(`<tr class="item tr-click" data-act="edit-line" data-id="${l.id}" data-div="${esc(code)}"${isC ? ' hidden' : ''}>
        <td class="code">${esc(l.subtask_code || '')}<button class="icon-btn line-del" data-act="delete-line" data-id="${l.id}" title="Delete budget line" aria-label="Delete budget line">${ICON_TRASH}</button></td>
        <td class="desc m-name"><span class="bud-name">${esc(lineName(l))}</span>${l.notes ? ` <span class="bud-note" title="${esc(l.notes)}">${ICON_NOTE}</span>` : ''}</td>
        <td class="g-start">${esc(l.unit || '')}</td>
        <td class="r">${fmtQty(l.qty)}</td>
        <td class="r">${money(l.rate)}</td>
        <td class="g-start">${dateOr(t?.start_date)}</td>
        <td>${dateOr(t?.end_date)}</td>
        <td class="r g-start">${money(l.budget)}</td>
        <td class="r m-amt">${money(bl)}</td>
        <td class="r g-start m-meta"><button class="link-btn" data-act="pay-line" data-id="${l.id}" title="Record a payment on this line">${money(lp)}</button></td>
        <td class="r m-owed" data-noact>${money(bl - lp)}</td>
        <td class="r var" data-noact>${varHtml(num(l.budget) - bl)}</td>
        <td class="ctr g-start">${l.bank_funded ? 'Yes' : 'No'}</td>
      </tr>`);
    });
    gBud += dBud; gTot += dTot; gPaid += dPaid;
  });
  body.push(`<tr class="tr-grand">
    <td colspan="3" class="m-name">${filtered ? 'Shown Total' : 'Total Budget'}</td>
    <td></td><td></td><td class="g-start"></td><td></td>
    <td class="r g-start">${money(gBud)}</td><td class="r">${money(gTot)}</td>
    <td class="r g-start">${money(gPaid)}</td><td class="r m-owed">${money(gTot - gPaid)}</td><td class="r var">${varHtml(gBud - gTot)}</td>
    <td class="g-start"></td>
  </tr>`);
  return `<div class="card bud-wrap" style="padding:0;overflow-x:auto">
    <table class="sheet-tbl bud-tbl${S.showBank ? '' : ' no-bank'}">
      <colgroup>${[96, null, 64, 88, 72, 96, 96, 88, 88, 80, 80, 80, 64].slice(0, S.showBank ? 13 : 12).map(w => w ? `<col style="width:${w}px">` : '<col>').join('')}</colgroup>
      <thead>
        <tr class="band"><th class="code"></th><th class="desc"></th>
          <th colspan="3" class="gh g-start">Quantity</th>
          <th colspan="2" class="gh g-start">Schedule</th>
          <th colspan="2" class="gh g-start">Cost</th>
          <th colspan="3" class="gh g-start">Paid To Date</th>
          <th class="gh g-start">Funding</th></tr>
        <tr><th class="code">Code</th><th class="desc">Description</th><th class="g-start">Unit</th><th class="r">Sq.Ft. / Qty</th><th class="r">Rate</th><th class="g-start">Start</th><th>End</th><th class="r g-start">Budget</th><th class="r">Contract</th><th class="r g-start">Paid</th><th class="r">Owed</th><th class="r">Variance</th><th class="ctr g-start">Bank Funded</th></tr>
      </thead>
      ${budDraftRow()}
      <tbody>${body.join('')}</tbody>
    </table>
  </div>
  <div class="small muted" style="text-align:center">Click a division to show or hide its sub-tasks. Budget is the amount set aside. Contract is the signed amount. Owed = Contract minus Paid. Variance = Budget minus Contract; red brackets mean over budget. Tap a line to edit it.</div>`;
}

function exportBudgetCsv(){
  const P = S.proj;
  const paid = paidByLine(P);
  const rows = [['Division', 'Code', 'Sub-Task', 'Unit', 'Start', 'End', 'Sq.Ft. / Qty', 'Rate', 'Budget', 'Revision', 'Total', 'Paid', 'Owed', 'Bank Funded', 'Notes']];
  P.lines.slice().sort((a, b) => a.division_code.localeCompare(b.division_code)).forEach(l => {
    const bl = budgetOf(l), lp = paid[l.id] || 0;
    rows.push([divName(l.division_code), l.subtask_code || 'Custom', lineName(l), l.unit || '', taskForLine(P, l.id)?.start_date || '', taskForLine(P, l.id)?.end_date || '', num(l.qty), num(l.rate), num(l.budget), num(l.revision), bl, lp, bl - lp, l.bank_funded ? 'Yes' : 'No', l.notes || '']);
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['﻿' + csv], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (P.project.name + ' Budget.csv').replace(/[\\/:*?"<>|]/g, '-');
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function budSubOptions(div){

function budChange(t){
  const body = t.closest('.bud-entry');
  if (t.dataset.b === 'div') fillSelect(body.querySelector('[data-b=sub]'), budSubOptions(t.value), '__div');
  if (t.dataset.b === 'sub'){
    const c = body.querySelector('[data-b=custom]');
    c.hidden = t.value !== '__custom';
    if (!c.hidden) c.focus();
  }
}
function budInput(el){
  const body = el.closest('.bud-entry');
  if (el.classList.contains('money')) el.value = formatMoneyText(el.value);
  body.querySelector('[data-b=budget]').textContent = money(num(body.querySelector('[data-b=qty]').value) * num(body.querySelector('[data-b=rate]').value));
}
async function saveBudDraft(P, body){
  const q = k => body.querySelector(`[data-b="${k}"]`);
  const div = q('div').value;
  if (!div) throw new Error('Choose the division for this line.');
  const sub = q('sub').value;
  if (!sub) throw new Error('Choose a sub-task, or Division Level if you do not have a breakdown.');
  const custom = sub === '__custom' ? q('custom').value.trim() : '';
  if (sub === '__custom' && !custom) throw new Error('Name the custom line.');
  const start = q('start').value, end = q('end').value;
  if (start || end){
    if (!start || !end) throw new Error('Enter both the start and end date, or clear both.');
    if (end < start) throw new Error('End date cannot be before the start date.');
  }
  const qty = num(q('qty').value), rate = num(q('rate').value);
  const divLevel = sub === '__div';
  const label = sub === '__custom' ? custom : divLevel ? `${S.divMap[div]?.name || 'Division'} Budget` : '';
  const line = check(await sb.from('project_lines').insert({
    project_id: P.project.id, division_code: div, subtask_code: sub === '__custom' || divLevel ? null : sub, label,
    unit: q('unit').value.trim(), notes: '', qty, rate, budget: qty * rate, contract_amount: num(q('contract').value), bank_funded: q('bank').checked
  }).select().single());
  await syncLineTask(P, line.id, line, {start_date: {value: start}, end_date: {value: end}, percent_complete: {value: '0'}});
  toast(divLevel ? 'Division budget added. Break it into sub-tasks later if you need to.' : 'Budget line added. Tap the line to set a revision or notes.');
  await render();
  document.querySelector('.bud-entry [data-b=div]')?.focus();
}

// ---------- Transactions (payments) ----------
function txRows(P){
  const rc = {};
  P.receipts.forEach(r => { rc[r.payment_id] = (rc[r.payment_id] || 0) + 1; });
  return P.pays.map(p => {
    const line = P.lines.find(l => l.id === p.budget_line_id);
    return {p, line,
      amt: num(p.amount),
      div: line ? line.division_code : '',
      task: line ? lineName(line) : '',
      vendor: p.vendors?.name || '',
      method: p.method || '', ref: p.reference || '',
      notes: p.notes || '',
      files: rc[p.id] || 0};
  });
}
function txFiltered(P){
  const q = (S.txQ || '').trim().toLowerCase();
  const div = S.txFilterDiv || '';
  const ven = S.txFilterVendor || '';
  return txRows(P).filter(r => {
    if (div && r.div !== div) return false;
    if (ven && (ven === '__none' ? !!r.p.vendor_id : r.p.vendor_id !== ven)) return false;
    return !q || [r.p.pay_date, r.amt, divName(r.div), r.task, r.vendor, r.method, r.ref, r.notes].join(' ').toLowerCase().includes(q);
  });
}
function txSorted(P){
  const rows = txFiltered(P);
  const by = {
    date_desc: (a, b) => (b.p.pay_date || '').localeCompare(a.p.pay_date || ''),
    date_asc: (a, b) => (a.p.pay_date || '').localeCompare(b.p.pay_date || ''),
    amount_desc: (a, b) => b.amt - a.amt,
    amount_asc: (a, b) => a.amt - b.amt,
    division: (a, b) => (a.div || '').localeCompare(b.div || '') || (a.p.pay_date || '').localeCompare(b.p.pay_date || ''),
    task: (a, b) => a.task.localeCompare(b.task),
    vendor: (a, b) => a.vendor.localeCompare(b.vendor)
  };
  return rows.sort(by[S.txSort || 'date_desc']);
}
function txFoot(P){
  const rows = txSorted(P);
  const total = rows.reduce((a, r) => a + r.amt, 0);
  const foot = $('#txFoot');
  if (foot) foot.innerHTML = rows.length ? `<tr><td colspan="2">Total</td><td class="r num">${money(total)}</td><td colspan="8" class="small muted">${rows.length} of ${P.pays.length} shown</td></tr>` : '';
}

const ICON_NOTE = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v12l-4 4H4z"/><path d="M8 9h8M8 13h5"/></svg>`;

function renderReports(P){
  const paidBy = paidByLine(P);
  const budget = P.lines.reduce((a, l) => a + budgetOf(l), 0);
  const paid = P.pays.reduce((a, p) => a + num(p.amount), 0);
  const owed = Math.max(0, budget - paid);
  const waiting = P.pays.filter(p => p.status === 'Waiting on vendor');
  const divs = {};
  P.lines.forEach(l => {
    const d = (divs[l.division_code] ||= {budget: 0, paid: 0});
    d.budget += budgetOf(l);
    d.paid += paidBy[l.id] || 0;
  });
  const divRows = Object.keys(divs).sort().map(code => {
    const d = divs[code];
    return `<div class="rep-row"><span>${esc(divName(code))}</span><span class="num">${money(d.paid)} of ${money(d.budget)} paid</span></div>`;
  }).join('') || '<div class="small muted">No budget lines yet.</div>';
  const vend = {};
  P.pays.forEach(p => {
    const name = (p.vendors && p.vendors.name) || 'No contractor';
    const v = (vend[name] ||= {paid: 0, count: 0});
    v.paid += num(p.amount);
    v.count++;
  });
  const vendRows = Object.keys(vend).sort().map(name => `<div class="rep-row"><span>${esc(name)} <span class="small muted">· ${vend[name].count} paid</span></span><span class="num">${money(vend[name].paid)}</span></div>`).join('')
    || '<div class="small muted">No payments yet.</div>';
  const coiRows = [...P.assignedIds].map(id => {
    const v = S.vendors.find(x => x.id === id);
    const st = coiStatus(P.insMap[id + '|' + P.project.id]);
    return {name: v ? v.name : 'Contractor', st};
  }).filter(x => x.st !== 'ok' && x.st !== 'dismissed');
  const coiHtml = coiRows.map(x => `<div class="rep-row"><span>${esc(x.name)}</span>${coiBadge(x.st)}</div>`).join('')
    || '<div class="small muted">Every assigned contractor has a certificate of insurance on file.</div>';
  $('#main').innerHTML = `
    <div class="page-h"><h2>Reports</h2></div>
    <div class="small muted" style="margin:-4px 0 12px">Built from this project's budget and transactions. Updates as you enter data.</div>
    <div class="card" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px">
      <div><div class="small muted">Budget</div><div class="num" style="font-size:18px">${money(budget)}</div></div>
      <div><div class="small muted">Paid</div><div class="num" style="font-size:18px">${money(paid)}</div></div>
      <div><div class="small muted">Owed</div><div class="num" style="font-size:18px">${money(owed)}</div></div>
      <div><div class="small muted">Waiting on vendor confirmation</div><div class="num" style="font-size:18px">${waiting.length} · ${money(waiting.reduce((a, p) => a + num(p.amount), 0))}</div></div>
    </div>
    <div class="card" style="margin-top:12px"><h3 style="margin:0 0 8px">Paid by division</h3>${divRows}</div>
    <div class="card" style="margin-top:12px"><h3 style="margin:0 0 8px">Payments by contractor</h3>${vendRows}</div>
    <div class="card" style="margin-top:12px"><h3 style="margin:0 0 8px">Insurance needing attention</h3>${coiHtml}</div>`;
}

// ---------- Files (receipts and insurance certificates for this project) ----------
function renderFiles(P){
  const payOf = id => P.pays.find(p => p.id === id) || {};
  const receipts = P.receipts.map(r => {
    const p = payOf(r.payment_id);
    return {path: r.path, name: r.filename || 'Receipt', kind: 'Receipt', date: p.pay_date || '',
      sub: `${p.pay_date ? fmtDate(p.pay_date) : ''} · ${(p.vendors && p.vendors.name) || 'No contractor'} · ${money(p.amount)}`};
  });
  const cois = Object.values(P.insMap).filter(r => r.file_path).map(r => {
    const v = S.vendors.find(x => x.id === r.vendor_id);
    return {path: r.file_path, name: 'Insurance certificate', kind: 'COI', date: r.expires_on || '',
      sub: `${v ? v.name : 'Contractor'}${r.expires_on ? ' · expires ' + fmtDate(r.expires_on) : ''}${r.holder_listed ? ' · bank listed' : ''}`};
  });
  const rows = [...cois, ...receipts].sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const list = rows.map(f => `
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px">
      <div><strong>${esc(f.name)}</strong> <span class="badge">${f.kind}</span><div class="small muted">${esc(f.sub)}</div></div>
      <button class="btn sm" data-act="open-file" data-path="${esc(f.path)}">Open</button>
    </div>`).join('');
  $('#main').innerHTML = `
    <div class="page-h"><h2>Files</h2></div>
    <div class="small muted" style="margin:-4px 0 12px">Receipts attach to transactions. Certificates of insurance attach to contractors.</div>
    ${list || '<div class="empty">No files yet.</div>'}`;
}

// ---------- Contractors (assigned to this project) ----------
function renderContractors(P){
  const assigned = S.vendors.filter(v => P.assignedIds.has(v.id));
  const rows = assigned.map(v => {
    const ins = P.insMap[v.id + '|' + P.project.id];
    const st = coiStatus(ins);
    const paid = P.pays.filter(p => p.vendor_id === v.id).reduce((a, p) => a + num(p.amount), 0);
    return {v, st, ins, paid};
  });
  const needing = rows.filter(r => r.st === 'missing' || r.st === 'expired');

  let html = `
    <div class="page-h">
      <h2>Contractors On This Project</h2>
      <button class="btn primary sm" data-act="assign">+ Assign Contractor</button>
    </div>`;

  if (needing.length){
    html += `<div class="notice bad"><strong>${needing.length} certificate${needing.length > 1 ? 's' : ''} of insurance missing.</strong>
      <div class="small" style="margin-top:4px">This reminder shows every day until you add the certificate or dismiss it with a reason.</div></div>`;
  }

  if (!rows.length){
    html += `<div class="empty">No contractors assigned yet. Assigning one asks you for their certificate of insurance.</div>`;
  }

  rows.forEach(r => {
    const open = r.st === 'missing' || r.st === 'expired' || r.st === 'soon';
    html += `
      <div class="card">
        <div class="card-h"><strong>${esc(r.v.name)}</strong><span class="num" style="font-weight:700">${money(r.paid)} paid</span></div>
        <div class="small muted">${esc([r.v.trade, r.v.company].filter(Boolean).join(' · ') || 'No trade listed')}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${coiBadge(r.st)}
          <span class="badge ${r.v.w9_path ? 'b-ok' : 'b-warn'}">${r.v.w9_path ? 'W-9 on file' : 'W-9 missing'}</span>
        </div>
        ${r.ins && r.ins.dismissed_reason ? `<div class="small muted">Dismissed: ${esc(r.ins.dismissed_reason)}${r.ins.dismissed_by ? ' · ' + esc(r.ins.dismissed_by) : ''}</div>` : ''}
        ${r.ins && r.ins.file_path && !r.ins.dismissed_reason ? `<div class="small muted">${esc(r.ins.insurer || 'Insurer not listed')}${r.ins.expires_on ? ' · expires ' + fmtDate(r.ins.expires_on) : ''}${r.ins.holder_listed ? ' · bank listed as holder' : ''}</div>` : ''}
        <div class="btn-row">
          ${open
            ? `<button class="btn primary" data-act="add-coi" data-id="${r.v.id}">Add Certificate</button>
               <button class="btn" data-act="dismiss-coi" data-id="${r.v.id}">Dismiss With Reason</button>`

        </div>
      </div>`;
  });

  $('#main').innerHTML = html;
}

// ---------- Sheets (forms) ----------
function sheet({title, html, submit = 'Save', onSubmit, onOpen, danger, keepPage = false, onDone, onCancel}){
  const d = document.createElement('dialog');
  d.className = 'sheet';
  d.innerHTML = `<form novalidate>
    <div class="sheet-h"><h2>${esc(title)}</h2><button type="button" class="x" data-close aria-label="Close">×</button></div>
    ${html}
    <p class="err" hidden></p>
    <div class="actions">
      ${danger ? `<button type="button" class="btn danger" data-danger>${esc(danger.label)}</button><span class="spacer"></span>` : '<span class="spacer"></span>'}
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary">${esc(submit)}</button>
    </div>
  </form>`;
  document.body.append(d);
  let finished = false;
  d.addEventListener('close', () => { d.remove(); if (!finished && onCancel) onCancel(); });
  const form = d.querySelector('form');
  d.querySelectorAll('input.money').forEach(el => el.addEventListener('input', () => { el.value = formatMoneyText(el.value); }));
  const err = d.querySelector('.err');
  const showErr = e => { err.textContent = msg(e); err.hidden = false; };
  d.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => d.close()));
  if (danger){
    d.querySelector('[data-danger]').addEventListener('click', async () => {
      if (!confirm(danger.confirm || 'Delete this? This cannot be undone.')) return;
      try { await danger.run(); d.close(); await render(); } catch (e) { showErr(e); }
    });
  }
  form.addEventListener('submit', async e => {
    e.preventDefault();
    err.hidden = true;
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true;
    try {
      await onSubmit(form);
      finished = true;
      d.close();
      if (!keepPage) await render();
      else if (onDone) { try { await onDone(); } catch (ex) { toast(msg(ex), true); } }
    }
    catch (ex) { showErr(ex); }
    finally { btn.disabled = false; }
  });
  onOpen && onOpen(form, d);
  d.showModal();
  return d;
}

function divOptions(selected = ''){

}

// Budget line (add or edit)
function calcBox(qty, rate){
  return `<div class="calc"><span class="small muted">Budget = Sq.Ft. / Qty × Rate</span><strong class="num" data-calc>${money(num(qty) * num(rate))}</strong></div>`;
}
function bindCalc(form){
  const v = form.elements;
  const out = form.querySelector('[data-calc]');
  const upd = () => { out.textContent = money(num(v.qty.value) * num(v.rate.value)); };
  v.qty.addEventListener('input', upd);
  v.rate.addEventListener('input', upd);
}
const UNIT_HINTS = ['SF', 'EA', 'HR'];
const unitSelect = (current = '') => {
  const cur = String(current || '').trim();
  const opts = UNIT_HINTS;
  return `<select name="unit"><option value="">—</option>${opts.map(u => `<option value="${esc(u)}" ${u === cur ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select>`;
};

function lineSheet(line){
  const P = S.proj;
  if (line){
    const paidHere = P.pays.filter(p => p.budget_line_id === line.id).reduce((a, p) => a + num(p.amount), 0);
    const custom = !line.subtask_code;
    const linked = taskForLine(P, line.id);
    sheet({
      title: lineName(line),
      html: `<div class="small muted">${esc(divName(line.division_code))}${line.subtask_code ? ' · ' + esc(line.subtask_code) : ''}</div>
        <div class="grid">
          ${custom ? `<label class="full">Line Name<input name="label" value="${esc(line.label)}"></label>` : ''}
          <label>Unit${unitSelect(line.unit)}</label>
          ${dateFields(linked)}
          <label>Sq.Ft. / Qty<input type="text" class="money" name="qty" inputmode="decimal" value="${esc(fmtInput(line.qty))}"></label>
          <label>Rate ($)<input type="text" class="money" name="rate" inputmode="decimal" value="${esc(fmtInput(line.rate))}"></label>
          <label class="check"><input type="checkbox" name="bank_funded" ${line.bank_funded ? 'checked' : ''}> Bank Funds This Line</label>
          <label class="full">Notes<input name="notes" value="${esc(line.notes)}" placeholder="Scope, vendor, or reference"></label>
          <label class="full">Signed Contract ($)<input type="text" class="money" name="contract_amount" value="${esc(fmtInput(line.contract_amount))}" placeholder="Leave blank until signed"></label>
          <label class="full">Revision ($)<input type="text" class="money" name="revision" inputmode="decimal" value="${esc(fmtInput(line.revision))}"></label>
          <label class="full">Reason For Revision<input name="revision_reason" value="${esc(line.revision_reason)}" placeholder="e.g. Change Order 2"></label>
        </div>
        ${calcBox(line.qty, line.rate)}
        <div class="small muted">Paid so far: ${money(paidHere)}. ${paidHere ? 'Lines with payments cannot be deleted.' : ''}</div>`,
      danger: paidHere ? null : {
        label: 'Delete Line',
        run: async () => {
          const t = taskForLine(P, line.id);
          if (t) check(await sb.from('schedule_tasks').delete().eq('id', t.id));
          check(await sb.from('project_lines').delete().eq('id', line.id));
        }
      },
      onOpen: form => bindCalc(form),
      onSubmit: async form => {
        const v = form.elements;
        const rev = num(v.revision.value);
        if (rev !== num(line.revision) && !v.revision_reason.value.trim()) throw new Error('Give a reason for the revision.');
        checkLineDates(v);
        const qty = num(v.qty.value), rate = num(v.rate.value);
        const row = {
          qty, rate, budget: qty * rate, unit: v.unit.value.trim(), notes: v.notes.value.trim(),
          revision: rev, revision_reason: v.revision_reason.value.trim(), bank_funded: v.bank_funded.checked,
          contract_amount: num(v.contract_amount.value)
        };
        if (custom){
          const label = v.label.value.trim();
          if (!label) throw new Error('Name the line.');
          row.label = label;
        }
        check(await sb.from('project_lines').update(row).eq('id', line.id));
        await syncLineTask(S.proj, line.id, {...line, ...row}, v);
      }
    });
    return;
  }

  sheet({
    title: 'Add Budget Line',
    html: `<div class="grid">
      <label class="full">Division<select name="division_code">${divOptions()}</select></label>
      <label class="full">Sub-Task<select name="subtask_code"></select></label>
      <label class="full" data-custom hidden>Line Name<input name="label" placeholder="e.g. Permit Fee, Unexpected"></label>
      <label>Unit${unitSelect()}</label>
      <label>Sq.Ft. / Qty<input type="text" class="money" name="qty" inputmode="decimal" value="1"></label>
      <label>Rate ($)<input type="text" class="money" name="rate" inputmode="decimal" value="0"></label>
      ${dateFields(null)}
      <label class="check"><input type="checkbox" name="bank_funded" checked> Bank Funds This Line</label>
      <label class="full">Notes<input name="notes" placeholder="Scope, vendor, or reference"></label>
    </div>
    ${calcBox(1, 0)}`,
    onOpen: (form) => {
      const v = form.elements;
      const fillSubs = () => {
        const code = v.division_code.value;
        const subs = S.subs.filter(s => s.division_code === code);
        v.subtask_code.innerHTML = `<option value="">Custom Line</option>` + subs.map(s => `<option value="${esc(s.code)}">${esc(s.code + ' ' + s.name)}</option>`).join('');
        v.bank_funded.checked = !!S.divMap[code]?.bank_funded;
        toggleCustom();
      };
      const toggleCustom = () => { form.querySelector('[data-custom]').hidden = !!v.subtask_code.value; };
      v.division_code.addEventListener('change', fillSubs);
      v.subtask_code.addEventListener('change', toggleCustom);
      bindCalc(form);
      fillSubs();
    },
    onSubmit: async form => {
      const v = form.elements;
      const sub = v.subtask_code.value || null;
      const label = v.label.value.trim();
      if (!sub && !label) throw new Error('Name the custom line, or pick a sub-task.');
      if (sub && S.proj.lines.some(l => l.subtask_code === sub)) throw new Error('That sub-task is already on this budget.');
      const qty = num(v.qty.value), rate = num(v.rate.value);
      checkLineDates(v);
      const created = check(await sb.from('project_lines').insert({
        project_id: S.proj.project.id, division_code: v.division_code.value,
        subtask_code: sub, label: sub ? '' : label, unit: v.unit.value.trim(), notes: v.notes.value.trim(),
        qty, rate, budget: qty * rate, bank_funded: v.bank_funded.checked
      }).select().single());
      await syncLineTask(S.proj, created.id, created, v);
    }
  });
}

// Payment (classification required)
// Shared by the entry row, the editable rows, and the phone form.
async function resolveVendorId(P, name){
  const vName = (name || '').trim();
  if (!vName) return {vendorId: null, name: '', created: false};
  const hit = S.vendors.find(v => v.name.toLowerCase() === vName.toLowerCase());
  let vendorId = hit ? hit.id : null, created = false, shown = hit ? hit.name : vName;
  if (!hit){
    const nv = check(await sb.from('vendors').insert({name: vName}).select().single());
    S.vendors.push(nv);
    S.vendors.sort((a, b) => a.name.localeCompare(b.name));
    vendorId = nv.id; created = true;
  }
  check(await sb.from('project_vendors').upsert({project_id: P.project.id, vendor_id: vendorId}, {onConflict: 'project_id,vendor_id', ignoreDuplicates: true}));
  return {vendorId, name: shown, created};
}
async function addLibraryLine(P, div, code){
  const line = check(await sb.from('project_lines').insert({
    project_id: P.project.id, division_code: div, subtask_code: code, label: '',
    budget: 0, bank_funded: !!S.divMap[div]?.bank_funded
  }).select().single());
  P.lines.push(line);
  return line;
}
async function resolveLineId(P, value, div){
  if (!div) throw new Error('Choose the division for this transaction.');
  const v = (value || '').trim();
  const need = 'Choose the task for this transaction. Nothing is saved without one.';
  if (!v) throw new Error(need);
  const hit = P.lines.find(l => l.id === v);
  if (hit){
    if (hit.division_code !== div) throw new Error(need);
    return {lineId: hit.id, created: false, label: lineName(hit), division_code: div};
  }
  if (v.startsWith('lib:')){
    const code = v.slice(4), sub = S.subMap[code];
    if (!sub || sub.division_code !== div) throw new Error(need);
    const existing = P.lines.find(l => l.subtask_code === code && l.division_code === div);
    if (existing) return {lineId: existing.id, created: false, label: sub.name, division_code: div};
    const line = await addLibraryLine(P, div, code);
    return {lineId: line.id, created: true, label: sub.name, division_code: div};
  }
  // Typed name (phone form): use a matching library sub-item or project line, otherwise add a custom line.
  const sub = S.subs.find(s => s.division_code === div && s.name.toLowerCase() === v.toLowerCase());
  if (sub) return resolveLineId(P, 'lib:' + sub.code, div);
  const named = P.lines.find(l => l.division_code === div && lineName(l).toLowerCase() === v.toLowerCase());
  if (named) return {lineId: named.id, created: false, label: lineName(named), division_code: div};
  const line = check(await sb.from('project_lines').insert({
    project_id: P.project.id, division_code: div, subtask_code: null, label: v,
    budget: 0, bank_funded: !!S.divMap[div]?.bank_funded
  }).select().single());
  P.lines.push(line);
  return {lineId: line.id, created: true, label: v, division_code: div};
}
function txNotes(v, l){
  const notes = [];
  if (v && v.created) notes.push(`Added ${v.name} to the Contractor Directory`);
  if (l && l.created) notes.push(`Added "${l.label}" as a task under ${divName(l.division_code || '')}. Set its budget on the Budget tab`);
  return notes.length ? notes.join('. ') + '.' : '';
}

async function savePaymentRecord(P, d){
  if (!d.date) throw new Error('Enter the payment date.');
  if (!(d.amount > 0)) throw new Error('Enter the amount.');
  const l = await resolveLineId(P, d.lineId || d.task, d.div);
  const v = await vendorFor(P, d.vendorId || null, d.vendorName);
  const pay = check(await sb.from('payments').insert({
    project_id: P.project.id, vendor_id: v.vendorId, budget_line_id: l.lineId,
    pay_date: d.date, amount: d.amount, method: d.method,
    reference: (d.reference || '').trim(), invoice_number: (d.invoice || '').trim()
  }).select().single());
  if (d.files && d.files.length) await attachFiles(`payments/${pay.id}`, pay.id, d.files);
  S.txDate = ''; S.txMethod = d.method; // date goes back to today; method stays; division, task, contractor, amount and check # clear
  return txNotes(v, l) || 'Transaction saved.';
}

// Dropdown options. Task lists only the tasks in the chosen division.
function taskOptions(div, selectedId = ''){
  if (!div) return '<option value="">Choose Division First</option>';
  const here = S.proj.lines.filter(l => l.division_code === div);
  const byCode = new Map(here.filter(l => l.subtask_code).map(l => [l.subtask_code, l]));
  const items = S.subs.filter(s => s.division_code === div).map(s => ({
    value: byCode.has(s.code) ? byCode.get(s.code).id : 'lib:' + s.code, label: s.name
  }));
  here.filter(l => !l.subtask_code).forEach(l => items.push({value: l.id, label: lineName(l)}));
  items.sort((a, b) => a.label.localeCompare(b.label));
  return '<option value="">Choose A Task</option>' +
    items.map(i => `<option value="${esc(i.value)}" ${i.value === selectedId ? 'selected' : ''}>${esc(i.label)}</option>`).join('') +
    '<option value="__new">+ New Task…</option>';
}
function vendorOptions(selectedId = ''){
  return '<option value="">No Contractor</option>' +
    S.vendors.map(v => `<option value="${v.id}" ${v.id === selectedId ? 'selected' : ''}>${esc(v.name)}</option>`).join('') +
    '<option value="__new">+ New Contractor…</option>';
}
// Replaces a select's options and keeps its current value when it still exists.
function fillSelect(sel, html, value){

// Rebuilds the contractor and task dropdowns in the other rows and the entry row.
function refreshTxSelects(except){
  document.querySelectorAll('#txRows tr').forEach(tr => {

async function attachFiles(folder, paymentId, files){
  for (const f of Array.from(files || [])){
    const path = await uploadFile(folder, f);
    check(await sb.from('payment_receipts').insert({payment_id: paymentId, path, filename: f.name}));
  }
}

async function uploadFile(folder, file){
  const safe = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const path = `${folder}/${Date.now()}-${safe}`;
  const res = await sb.storage.from('receipts').upload(path, file, {contentType: file.type || undefined});
  if (res.error) throw res.error;
  return path;
}

async function openFile(path){
  const res = await sb.storage.from('receipts').createSignedUrl(path, 600);
  if (res.error) throw res.error;
  const a = document.createElement('a');
  a.href = res.data.signedUrl;
  a.target = '_blank';
  a.rel = 'noopener';
  a.click();
}

      check(await sb.from('library_divisions').insert({code, name: v.name.value.trim(), bank_funded: v.bank_funded.checked, sort_order: 0}));
    }
  });
}

function subtaskSheet(divCode, onCreated, onCancel){
  const nextCode = () => {
    const subs = S.subs.filter(s => s.division_code === divCode);
    const n = Math.max(0, ...subs.map(s => Number(s.code.slice(4)))) + 10;
    return `${divCode.slice(0, 3)}-${String(n).padStart(3, '0')}`;
  };
  let created = null;
  sheet({
    title: `New Sub-Task · ${divName(divCode)}`,
    html: `<label>Name<input name="name" required placeholder="e.g. Pool heater"></label>
      <div class="small muted">Saved to the Library under ${esc(divName(divCode))}. Code will be ${nextCode()}.</div>`,
    keepPage: !!onCreated, onCancel, onDone: onCreated ? () => onCreated(created) : null,
    onSubmit: async form => {
      const name = form.elements.name.value.trim();
      if (!name) throw new Error('Enter a name.');
      created = check(await sb.from('library_subtasks').insert({code: nextCode(), division_code: divCode, name, sort_order: 0}).select().single());
      S.subs.push(created);
      S.subs.sort((a, b) => a.code.localeCompare(b.code));
      S.subMap[created.code] = created;
    }
  });
}
