// ---------- Line Dates (shared with Schedule) ----------
const taskForLine = (P, lineId) => (P.tasks || []).find(t => t.budget_line_id === lineId);
function checkLineDates(v){
  const start = v.start_date.value, end = v.end_date.value;
  if (!start && !end) return;
  if (!start || !end) throw new Error('Enter both the start and end date, or clear both.');
  if (end < start) throw new Error('End date cannot be before the start date.');
  const pct = num(v.percent_complete.value);
  if (pct < 0 || pct > 100) throw new Error('% complete must be between 0 and 100.');
}
// Keeps the schedule task for a budget line in step with the dates typed on the line.
async function syncLineTask(P, lineId, line, v){
  const start = v.start_date.value, end = v.end_date.value;
  const existing = taskForLine(P, lineId);
  if (!start && !end){
    if (existing) check(await sb.from('schedule_tasks').delete().eq('id', existing.id));
    return;
  }
  const row = {project_id: P.project.id, budget_line_id: lineId, name: lineName(line),
    start_date: start, end_date: end, percent_complete: num(v.percent_complete.value)};
  if (existing) check(await sb.from('schedule_tasks').update(row).eq('id', existing.id));
  else check(await sb.from('schedule_tasks').insert(row));
}
const dateFields = t => `
      <label>Start Date<input type="date" name="start_date" value="${t ? t.start_date : ''}"></label>
      <label>End Date<input type="date" name="end_date" value="${t ? t.end_date : ''}"></label>
      <label>% Complete<input type="number" name="percent_complete" min="0" max="100" step="1" value="${t ? num(t.percent_complete) : 0}"></label>`;

// ---------- Schedule ----------
const atNoon = d => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const toDate = s => new Date(s + 'T12:00:00');
const rangeLabel = (a, b) => `${a.toLocaleDateString('en-US', {month:'short', day:'numeric'})} – ${b.toLocaleDateString('en-US', {month:'short', day:'numeric'})}`;

function taskStatus(t, today){
  if (num(t.percent_complete) >= 100) return 'Complete';
  if (toDate(t.end_date) < today) return 'Late';
  if (toDate(t.start_date) <= today) return 'In Progress';
  return 'Not Started';
}
const STATUS_BADGE = {Complete:'b-ok', Late:'b-bad', 'In Progress':'b-info', 'Not Started':''};

function ganttRows(P){
  const rows = [];
  const byDiv = {};
  P.lines.forEach(l => { (byDiv[l.division_code] ||= []).push(l); });
  const span = ts => ts.length ? {
    start_date: ts.map(t => t.start_date).sort()[0],
    end_date: ts.map(t => t.end_date).sort().slice(-1)[0],
    percent_complete: ts.reduce((a, t) => a + num(t.percent_complete), 0) / ts.length
  } : null;
  Object.keys(byDiv).sort().forEach(code => {
    const ls = byDiv[code];
    rows.push({kind: 'div', label: `${code}  ${S.divMap[code]?.name || 'Unnamed Division'}`,
      budget: ls.reduce((a, l) => a + budgetOf(l), 0),
      task: span(ls.map(l => taskForLine(P, l.id)).filter(Boolean))});
    ls.forEach(l => rows.push({kind: 'line', label: lineName(l), budget: budgetOf(l), line: l, task: taskForLine(P, l.id)}));
  });
  (P.tasks || []).filter(t => !t.budget_line_id).forEach(t => rows.push({kind: 'task', label: t.name, budget: null, task: t}));
  return rows;
}

async function renderSchedule(P){
  const tasks = P.tasks || [];
  const today = atNoon(new Date());
  const weekStart = addDays(today, -((today.getDay() + 6) % 7));
  const y = today.getFullYear(), m = today.getMonth();
  const windows = [
    ['This Week', weekStart, addDays(weekStart, 6)],
    ['Next Week', addDays(weekStart, 7), addDays(weekStart, 13)],
    ['This Month', new Date(y, m, 1, 12), new Date(y, m + 1, 0, 12)],
    ['Next Month', new Date(y, m + 1, 1, 12), new Date(y, m + 2, 0, 12)]
  ];
  const opts = {thisWeek: 0, nextWeek: 1, thisMonth: 2, nextMonth: 3};
  const pick = S.lookWin in opts ? S.lookWin : 'thisWeek';
  const [wLabel, wa, wb] = windows[opts[pick]];
  const active = tasks.filter(t => toDate(t.start_date) <= wb && toDate(t.end_date) >= wa);
  const look = `<div class="card look">
    <div class="card-h">
      <div><strong>Look-Ahead</strong> <span class="small muted">${rangeLabel(wa, wb)}</span></div>
      <select id="lookSel" aria-label="Look-ahead window">${windows.map(([l], i) => {
        const key = Object.keys(opts).find(k => opts[k] === i);
        return `<option value="${key}" ${key === pick ? 'selected' : ''}>${l}</option>`;
      }).join('')}</select>
    </div>
    <div class="small muted">${active.length} ${active.length === 1 ? 'Task' : 'Tasks'} Active</div>
    ${active.map(t => `<div class="la-row"><span>${esc(t.name)}</span><span class="small muted num">${dateOr(t.start_date)} – ${dateOr(t.end_date)}</span></div>`).join('')}
  </div>`;

  const rows = ganttRows(P);
  const dated = rows.filter(r => r.task);
  const avg = tasks.length ? tasks.reduce((a, t) => a + num(t.percent_complete), 0) / tasks.length : 0;

  let timeline;
  if (!dated.length){
    timeline = `<div class="empty">No dates yet. Add a start and end date to a budget line or a task to see it on the timeline.</div>`;
  } else {
    const DW = 16;
    const rs = addDays(toDate(dated.map(r => r.task.start_date).sort()[0]), -3);
    const re = addDays(toDate(dated.map(r => r.task.end_date).sort().slice(-1)[0]), 7);
    const N = Math.round((re - rs) / 86400000) + 1;
    const W = N * DW;
    const offset = s => Math.round((toDate(s) - rs) / 86400000);
    const todayOff = Math.round((today - rs) / 86400000);
    const todayLine = todayOff >= 0 && todayOff < N ? `<div class="g-today" style="left:${todayOff * DW + DW / 2}px"></div>` : '';

    let mHead = '', dHead = '';
    for (let i = 0; i < N;){
      const d = addDays(rs, i);
      let len = 0;
      while (i + len < N && addDays(rs, i + len).getMonth() === d.getMonth()) len++;
      const seg = len * DW;
      const mLabel = seg >= 90 ? d.toLocaleDateString('en-US', {month: 'short', year: 'numeric'})
        : seg >= 30 ? d.toLocaleDateString('en-US', {month: 'short'}) : '';
      mHead += `<div class="g-mon" style="width:${seg}px">${mLabel}</div>`;
      i += len;
    }
    for (let k = 0; k < N; k++) dHead += `<div class="g-day" style="width:${DW}px">${addDays(rs, k).getDate()}</div>`;

    const body = rows.map(r => {
      const t = r.task;
      const pct = t ? Math.min(100, Math.max(0, Math.round(num(t.percent_complete)))) : null;
      const days = t ? Math.round((toDate(t.end_date) - toDate(t.start_date)) / 86400000) + 1 : '';
      const act = r.kind === 'line' ? `data-act="edit-line" data-id="${r.line.id}"`
        : r.kind === 'task' ? `data-act="edit-task" data-id="${r.task.id}"` : '';
      const pad = r.kind === 'line' ? 22 : 0;
      const bar = t ? `<div class="g-bar ${r.kind === 'div' ? 'g-sum' : ''}" style="left:${offset(t.start_date) * DW}px;width:${days * DW}px"><i style="width:${pct}%"></i></div>` : '';
      return `<div class="g-row g-kind-${r.kind} ${act ? 'g-click' : ''}" ${act}>
        <div class="g-left">
          <div class="g-name" style="padding-left:${10 + pad}px">${esc(r.label)}</div>
          <div class="g-bud num">${r.budget == null ? '' : money(r.budget)}</div>
          <div class="g-st num">${t ? dateOr(t.start_date) : ''}</div>
          <div class="g-days num">${days}</div>
          <div class="g-pct">${t ? `<span class="g-mini"><i style="width:${pct}%"></i></span><span class="num">${pct}%</span>` : ''}</div>
        </div>
        <div class="g-right" style="width:${W}px">${todayLine}${bar}</div>
      </div>`;
    }).join('');

    timeline = `<div class="g-wrap">
      <div class="g-row g-head">
        <div class="g-left"></div>
        <div class="g-right g-hdr" style="width:${W}px">${mHead}</div>
      </div>
      <div class="g-row g-sub">
        <div class="g-left"><div class="g-name" style="padding-left:10px">Budget Item</div><div class="g-bud">Budget</div><div class="g-st">Start</div><div class="g-days">Days</div><div class="g-pct">% Complete</div></div>
        <div class="g-right g-hdr" style="width:${W}px">${dHead}</div>
      </div>
      ${body}
    </div>`;
  }

  $('#main').innerHTML = `
    ${P.tasksError ? `<div class="notice bad">Schedule is not set up yet. Run supabase/005_schedule.sql in Supabase. (${esc(P.tasksError)})</div>` : ''}
    <div class="page-h">
      <h2>Schedule</h2>
      <button class="btn primary sm" data-act="new-task">+ Add Task</button>
    </div>
    ${look}
    <div class="page-h">
      <h3>Timeline</h3>
      <span class="small muted">${tasks.length} ${tasks.length === 1 ? 'task' : 'tasks'} · ${avg.toFixed(0)}% average complete</span>
    </div>
    ${timeline}
    <div class="small muted" style="text-align:center;margin-top:10px">Tap a line to set its dates. Dates here and on the budget are the same.</div>`;
}

function taskSheet(task, P){
  const opts = `<option value="">None</option>` + P.lines.map(l =>
    `<option value="${l.id}" ${task && task.budget_line_id === l.id ? 'selected' : ''}>${esc(lineName(l))}</option>`).join('');
  sheet({
    title: task ? task.name : 'Add Task',
    html: `<div class="grid">
      <label class="full">Task Name<input name="name" value="${esc(task ? task.name : '')}" placeholder="e.g. Framing, Roof Dry-In"></label>
      <label>Start Date<input type="date" name="start_date" value="${task ? task.start_date : ''}"></label>
      <label>End Date<input type="date" name="end_date" value="${task ? task.end_date : ''}"></label>
      <label>% Complete<input type="number" name="percent_complete" min="0" max="100" step="1" value="${task ? num(task.percent_complete) : 0}"></label>
      <label>Budget Line<select name="budget_line_id">${opts}</select></label>
      <label class="full">Notes<input name="notes" value="${esc(task ? task.notes : '')}" placeholder="Crew, inspection, or reference"></label>
    </div>`,
    danger: task ? {label: 'Delete Task', run: async () => check(await sb.from('schedule_tasks').delete().eq('id', task.id))} : null,
    onSubmit: async form => {
      const v = form.elements;
      const name = v.name.value.trim();
      const start = v.start_date.value, end = v.end_date.value;
      const pct = num(v.percent_complete.value);
      if (!name) throw new Error('Name the task.');
      if (!start) throw new Error('Enter the start date.');
      if (!end) throw new Error('Enter the end date.');
      if (end < start) throw new Error('End date cannot be before the start date.');
      if (pct < 0 || pct > 100) throw new Error('% complete must be between 0 and 100.');
      const bl = v.budget_line_id.value || null;
      if (bl && P.tasks.some(t => t.budget_line_id === bl && (!task || t.id !== task.id)))
        throw new Error('That budget line already has a schedule task. Change its dates on the budget line.');
      const row = {project_id: P.project.id, name, start_date: start, end_date: end, percent_complete: pct,
        budget_line_id: bl, notes: v.notes.value.trim()};
      if (task) check(await sb.from('schedule_tasks').update(row).eq('id', task.id));
      else check(await sb.from('schedule_tasks').insert(row));
    }
  });
}

  if (a === 'library') return {view: 'library'};
  if (a === 'vendors') return {view: 'vendors'};
  return {view: 'projects'};
}

        <div class="side-pname">${esc(pr.name)}</div>
        <div class="side-sub">${esc(pr.address || pr.status)}</div>
        <button class="side-btn" data-act="edit-project" style="margin-top:8px">Project Details</button>
      </div>
      <div class="side-group">
        <div class="side-sec">Project</div>
        ${link(`#/project/${id}/budget`, 'Budget', r.tab === 'budget', 'child')}
        ${link(`#/project/${id}/schedule`, 'Schedule', r.tab === 'schedule', 'child')}
        ${link(`#/project/${id}/payments`, 'Transactions', r.tab === 'payments', 'child')}
        ${link(`#/project/${id}/contractors`, 'Contractors', r.tab === 'contractors', 'child')}
        ${link(`#/project/${id}/reports`, 'Reports', r.tab === 'reports', 'child')}
        ${link(`#/project/${id}/files`, 'Files', r.tab === 'files', 'child')}
      </div>
      <div class="side-group">
        <div class="side-sec">Company</div>
        ${link('#/library', 'Library', r.view === 'library', 'top')}
        ${link('#/vendors', 'Contractor Directory', r.view === 'vendors', 'top')}
      </div>`;
  } else {
    html += `<div class="side-group">
        <div class="side-sec">Home</div>
        ${link('#/projects', 'All Projects', r.view === 'projects', 'top')}
      </div>
      <div class="side-group">
        <div class="side-sec">Company</div>
        ${link('#/library', 'Library', r.view === 'library', 'top')}
        ${link('#/vendors', 'Contractor Directory', r.view === 'vendors', 'top')}
      </div>`;
  }
  html += `<div class="side-foot"><button class="side-btn" data-act="sign-out">Sign Out</button></div>`;
  $('#side').innerHTML = html;
}

function setNav(r){
  if (r.view !== 'project') renderSide(r);
  const key = r.view === 'project' ? 'projects' : r.view;
  document.querySelectorAll('[data-nav]').forEach(a => {
    if (a.dataset.nav === key) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
}

let rendering = 0;
async function render(){
  if (!session) return;
  const r = route();
  setNav(r);
  const token = ++rendering;
  $('#main').innerHTML = '<p class="muted" style="text-align:center;padding:30px 0">Loading…</p>';
  try {
    if (r.view === 'projects') await renderProjects();
    else if (r.view === 'project') await renderProject(r);
    else if (r.view === 'library') await renderLibrary();
    else if (r.view === 'vendors') await renderVendors();
    if (token !== rendering) return;
  } catch (e) {
    if (token !== rendering) return;
    $('#main').innerHTML = `<div class="notice bad">Could not load: ${esc(msg(e))}</div>`;
  }
}
window.addEventListener('hashchange', render);

// ---------- Sign in and session ----------
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const v = Object.fromEntries(new FormData(e.currentTarget));
  const res = await sb.auth.signInWithPassword({email: v.email.trim(), password: v.password});
  if (res.error){
    $('#loginErr').textContent = res.error.message;
    $('#loginErr').hidden = false;
  }
});

function showSignedIn(on){
  $('#gate').classList.toggle('hidden', on);
  $('#app').classList.toggle('hidden', !on);
}

sb.auth.onAuthStateChange((_event, s) => {
  session = s;
  // Run app queries after the auth callback returns. Awaiting queries inside it can hang in some browsers.
  setTimeout(() => startApp(s), 0);
});

async function startApp(s){
  if (!s){ showSignedIn(false); return; }
  showSignedIn(true);
  try {
    await loadLibrary();
    if (!location.hash) location.hash = '#/projects';
    await render();
  } catch (e) {
    $('#main').innerHTML = `<div class="notice bad">Could not load: ${esc(msg(e))}</div>`;
  }
}
</script>
</body>
</html>
